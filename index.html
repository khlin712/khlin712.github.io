<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KH Lin｜個人網站</title>
  <style>
    body {
      font-family: "Noto Sans TC", Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
      color: #222;
      line-height: 1.8;
    }

    header {
      background: #222;
      color: white;
      padding: 80px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 18px;
      color: #ddd;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    section {
      background: white;
      padding: 30px;
      margin-bottom: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    h2 {
      margin-top: 0;
      border-left: 5px solid #222;
      padding-left: 12px;
    }

    .button {
      display: inline-block;
      background: #222;
      color: white;
      padding: 12px 20px;
      border-radius: 999px;
      text-decoration: none;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 40px 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>KH Lin</h1>
    <p>國寫教學｜社會議題觀察｜作品集</p>
  </header>

  <main>
    <section>
      <h2>關於我</h2>
      <p>
        我是 KH Lin，這裡會整理我的教學理念、學生回饋、研究作品與公開發表內容。
      </p>
    </section>

    <section>
      <h2>國寫教學</h2>
      <p>
        我相信作文不是只靠天賦或運氣，而是可以透過架構、素材轉化與審題訓練穩定進步。
      </p>
      <a class="button" href="#">查看課程介紹</a>
    </section>

    <section>
      <h2>作品集</h2>
      <p>
        這裡可以放簡報、研究報告、文章、講座紀錄與其他作品。
      </p>
    </section>

    <section>
      <h2>聯絡我</h2>
      <p>
        歡迎透過 Email、Instagram 或 LINE 與我聯繫。
      </p>
    </section>
  </main>

  <footer>
    © 2026 KH Lin
  </footer>
