<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互動式家系圖 (Genogram Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdfbf7;
            margin: 0;
            overflow: hidden; 
            overscroll-behavior: none; 
            touch-action: none; 
        }
        
        .notebook-bg {
            background-color: #f8fafc;
            background-image: 
                linear-gradient(#e2e8f0 1px, transparent 1px),
                linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 2rem 2rem;
            background-position: -1px -1px;
        }
        
        .node-container { transition: transform 0.15s ease, filter 0.15s ease; }
        .node-container:hover { transform: scale(1.1); z-index: 50; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }

        .drawer-open { transform: translateX(0); box-shadow: -10px 0 25px rgba(0,0,0,0.05); }
        .drawer-closed { transform: translateX(100%); }

        /* 修正 2: 將 box-shadow 改為 drop-shadow，讓光暈完全貼合方塊、圓形或三角形輪廓 */
        @keyframes goldGlow {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.7)); }
            50% { filter: drop-shadow(0 0 12px rgba(245, 158, 11, 1)); }
        }
        .glow-gold {
            animation: goldGlow 2s infinite ease-in-out;
        }

        .print-only { display: none; }

        /* 完美列印樣式 (動態自適應 A4) */
        @media print {
            .no-print, .hide-on-present { display: none !important; }
            .print-only { display: block !important; }
            
            body, html { 
                background: white !important; 
                overflow: hidden !important; 
                margin: 0 !important; 
                padding: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
            }
            
            main#viewport { 
                background: white !important; 
                display: block !important; 
                overflow: hidden !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
            }
            
            .notebook-bg { background-image: none !important; }
            
            .glow-gold { 
                animation: none !important; 
                filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.8)) !important;
            }
            
            #zoom-wrapper { 
                position: absolute !important; 
                top: 0 !important;
                left: 0 !important;
            }
            
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { size: A4 landscape; margin: 0; }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-gray-800 relative">

    <nav class="hide-on-present bg-white shadow-sm border-b border-gray-200 px-6 py-3 flex justify-between items-center z-[60] relative">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-bold text-blue-900 flex items-center">
                <svg class="w-6 h-6 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                家系圖工作站 Pro
            </h1>
            
            <div class="flex items-center ml-2 pl-4 border-l border-gray-300">
                <label for="client-name" class="text-sm font-bold text-gray-700 mr-2">案主：</label>
                <input type="text" id="client-name" class="px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none w-32 bg-gray-50 hover:bg-white transition" placeholder="請輸入姓名/代號" onchange="updateGlobal()">
            </div>

            <div class="flex space-x-1 border border-gray-200 rounded-lg p-1 bg-gray-50 ml-4">
                <button onclick="undo()" class="p-1.5 text-gray-500 hover:text-blue-600 hover:bg-white rounded transition" title="復原 (Ctrl+Z)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                </button>
                <button onclick="redo()" class="p-1.5 text-gray-500 hover:text-blue-600 hover:bg-white rounded transition" title="重做 (Ctrl+Y)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"></path></svg>
                </button>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="zoomIn()" class="p-2 text-gray-600 hover:bg-gray-100 rounded" title="放大"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg></button>
            <button onclick="zoomOut()" class="p-2 text-gray-600 hover:bg-gray-100 rounded" title="縮小"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path></svg></button>
            <div class="w-px h-6 bg-gray-300 mx-1"></div>
            <button onclick="exportPDF()" class="px-3 py-1.5 text-sm font-medium text-white bg-gray-800 rounded hover:bg-gray-700 shadow-sm">匯出 PDF</button>
            <button onclick="exportJSON()" class="px-3 py-1.5 text-sm font-medium text-green-700 bg-green-50 border border-green-200 rounded hover:bg-green-100">下載 JSON</button>
            <label class="px-3 py-1.5 text-sm font-medium text-purple-700 bg-purple-50 border border-purple-200 rounded hover:bg-purple-100 cursor-pointer">
                匯入資料
                <input type="file" id="import-json" class="hidden" accept=".json" onchange="importJSON(event)">
            </label>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden relative">
        <aside class="hide-on-present w-72 bg-white border-r border-gray-200 p-5 flex flex-col space-y-5 z-40 shrink-0">
            <div>
                <h3 class="text-sm font-bold text-gray-800 flex items-center mb-1">
                    <svg class="w-4 h-4 mr-1 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> 重大事件記錄
                </h3>
                <textarea id="global-events" class="w-full h-28 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="金錢糾葛、生死糾葛、重大變故..." onchange="updateGlobal()"></textarea>
            </div>
            <div>
                <h3 class="text-sm font-bold text-gray-800 flex items-center mb-1">
                    <svg class="w-4 h-4 mr-1 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg> 隱諱不提的人事物
                </h3>
                <textarea id="global-hidden" class="w-full h-28 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="家族秘密、刻意避談的人..." onchange="updateGlobal()"></textarea>
            </div>
            <div class="mt-auto bg-blue-50 p-4 rounded-lg border border-blue-100 text-xs text-blue-800">
                <p class="font-bold mb-1">操作提示：</p>
                <ul class="list-disc pl-4 space-y-1">
                    <li>系統會<b>自動存檔</b>，關閉網頁不會遺失。</li>
                    <li><span class="text-amber-600 font-bold">亮金邊</span>的人物代表資料尚未確認或填寫完整。</li>
                    <li>「存活」的成員須勾選確認資訊；「已歿」的成員須填寫年齡與原因才能消除金邊。</li>
                </ul>
            </div>
            <button onclick="clearAll()" class="mt-2 w-full px-3 py-2 text-sm font-medium text-red-600 border border-red-200 rounded hover:bg-red-50 transition">
                清空重置
            </button>
        </aside>

        <main class="flex-1 relative overflow-hidden bg-gray-200 cursor-grab" id="viewport">
            
            <!-- 修正 3: 列印專用的備註區塊 (預設隱藏，列印時才會浮現在 A4 左下角) -->
            <div id="print-notes" class="print-only absolute bottom-8 left-8 z-50 bg-white p-6 rounded-xl border-2 border-gray-300 w-[400px] shadow-sm">
                <div class="mb-4">
                    <h3 class="font-bold text-gray-800 text-base mb-1 border-b border-gray-200 pb-1">重大事件記錄</h3>
                    <p id="print-events-text" class="text-sm text-gray-700 whitespace-pre-wrap mt-2 leading-relaxed">無</p>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-base mb-1 border-b border-gray-200 pb-1">隱諱不提的人事物</h3>
                    <p id="print-hidden-text" class="text-sm text-gray-700 whitespace-pre-wrap mt-2 leading-relaxed">無</p>
                </div>
            </div>

            <div id="zoom-wrapper" class="notebook-bg absolute origin-top-left flex justify-center w-[3000px] h-[2400px]" style="transform: translate(-500px, -200px) scale(1);">
                <div id="draw-area" class="relative w-[2200px] mt-32 z-10 flex flex-col items-center">
                    
                    <svg id="svg-lines" class="absolute inset-0 w-full h-full pointer-events-none z-0 overflow-visible"></svg>

                    <!-- Labels -->
                    <div id="label-pg-marriage" class="absolute z-20 cursor-pointer text-xs font-medium text-blue-800 bg-white px-2 py-0.5 rounded border border-blue-300 shadow-sm hover:ring-2 ring-blue-400 transition" onclick="openDrawer('marriage', 'paternal')"></div>
                    <div id="label-mg-marriage" class="absolute z-20 cursor-pointer text-xs font-medium text-blue-800 bg-white px-2 py-0.5 rounded border border-blue-300 shadow-sm hover:ring-2 ring-blue-400 transition" onclick="openDrawer('marriage', 'maternal')"></div>
                    <div id="label-parents-marriage" class="absolute z-20 cursor-pointer text-sm font-bold text-indigo-900 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-300 shadow hover:ring-2 ring-indigo-400 transition" onclick="openDrawer('marriage', 'client')"></div>
                    <div id="label-client-marriage" class="absolute z-20 cursor-pointer text-xs font-medium text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-300 shadow-sm hover:ring-2 ring-emerald-400 transition" onclick="openDrawer('marriage', 'clientFamily')"></div>

                    <!-- L1: Grandparents -->
                    <div class="flex justify-between w-full relative z-10 mb-24">
                        <div class="flex justify-center items-start gap-40 w-1/2 relative" id="pg-container">
                            <div id="wrap-pg_h"></div>
                            <div id="wrap-pg_w"></div>
                        </div>
                        <div class="flex justify-center items-start gap-40 w-1/2 relative" id="mg-container">
                            <div id="wrap-mg_h"></div>
                            <div id="wrap-mg_w"></div>
                        </div>
                    </div>

                    <!-- L1.5: Parents generation -->
                    <div class="flex justify-between w-full relative z-10">
                        <div class="flex justify-center items-start gap-4 w-1/2" id="paternal-children-container"></div>
                        <div class="flex justify-center items-start gap-4 w-1/2" id="maternal-children-container"></div>
                    </div>

                    <!-- L2: Client Generation -->
                    <div class="flex flex-col items-center mt-32 z-10 w-full relative">
                        <div class="flex justify-center items-start gap-4" id="client-children-container"></div>
                    </div>

                    <!-- L3: Client's Children Generation -->
                    <div class="flex flex-col items-center mt-32 z-10 w-full relative">
                        <div class="flex justify-center items-start gap-4" id="client-family-children-container"></div>
                    </div>

                </div>
            </div>
        </main>
        
        <div id="drawer-backdrop" class="fixed inset-0 bg-black/10 z-[70] hidden transition-opacity opacity-0" onclick="closeDrawer()"></div>

        <aside id="right-drawer" class="fixed top-0 right-0 h-full w-80 bg-white border-l border-gray-200 z-[80] drawer-closed transition-transform duration-300 ease-in-out flex flex-col no-print">
            <div class="px-5 py-4 border-b flex justify-between items-center bg-gray-50/80 backdrop-blur">
                <h3 id="drawer-title" class="font-bold text-gray-800 text-lg">編輯</h3>
                <button onclick="closeDrawer()" class="p-1 rounded hover:bg-gray-200 text-gray-500 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-5 flex-1 overflow-y-auto no-scrollbar relative flex flex-col">
                
                <div id="form-siblings" class="hidden flex-col h-full">
                    <div class="bg-blue-50 text-blue-800 p-3 rounded-lg text-xs leading-relaxed border border-blue-100 mb-4 shrink-0">
                        請依長幼順序設定，由上至下對應圖表中的<b>由左至右</b>。最多可設定 10 位。<br>
                        <span class="text-red-600 font-bold">* 記得必須選擇一位「主角」喔！</span>
                    </div>
                    <div id="sibling-slots-container" class="space-y-2 pb-10 overflow-y-auto flex-1 no-scrollbar">
                        <!-- Javascript 注入 10 個 select -->
                    </div>
                </div>

                <div id="form-node" class="hidden space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">生理性別 / 狀態</label>
                        <select id="edit-type" class="w-full p-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition bg-gray-50" onchange="toggleNodeFields()">
                            <option value="male">男性 (方塊)</option>
                            <option value="female">女性 (圓形)</option>
                            <option value="star">預設 (星星)</option>
                            <option value="abortion" id="opt-abortion">流產/墮胎 (三角形)</option>
                        </select>
                        <p id="edit-type-hint" class="text-[10px] text-gray-400 mt-1 hidden">此選項受「排序」管控，請至排列清單修改</p>
                    </div>

                    <div id="field-status" class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <label class="block text-sm font-medium text-gray-700 mb-2">生存狀態</label>
                        <div class="flex space-x-6">
                            <label class="flex items-center cursor-pointer"><input type="radio" name="edit-status" value="alive" class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-gray-300" onchange="toggleNodeFields()"> <span class="ml-2 text-sm">存活</span></label>
                            <label class="flex items-center cursor-pointer"><input type="radio" name="edit-status" value="dead" class="w-4 h-4 text-red-600 focus:ring-red-500 border-gray-300" onchange="toggleNodeFields()"> <span class="ml-2 text-sm text-red-600 font-medium">已歿</span></label>
                        </div>
                    </div>

                    <div id="field-age">
                        <label id="label-edit-age" class="block text-sm font-medium text-gray-700 mb-1">年齡 (供圖面顯示)</label>
                        <input type="number" id="edit-age" class="w-full p-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="例如: 25">
                    </div>

                    <div id="field-dead-reason" class="hidden">
                        <label id="label-dead-reason" class="block text-sm font-medium text-red-700 mb-1">離世/流產 原因</label>
                        <textarea id="edit-dead-reason" class="w-full p-2.5 text-sm border border-red-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition resize-none h-20" placeholder="例如: 車禍, 生病..." oninput="validateDrawerForm()"></textarea>
                    </div>

                    <div id="field-waishengren" class="hidden p-4 bg-amber-50 rounded-lg border border-amber-200 mt-2">
                        <label class="flex items-center font-medium text-gray-800 mb-2 cursor-pointer">
                            <input type="checkbox" id="edit-is-waisheng" class="w-4 h-4 text-amber-600 rounded focus:ring-amber-500" onchange="toggleNodeFields()"> 
                            <span class="ml-2 text-sm">標記為外省背景</span>
                        </label>
                        <div id="field-waisheng-reason" class="hidden mt-2">
                            <label class="block text-xs text-gray-600 mb-1">來台原因或特殊註記</label>
                            <textarea id="edit-waisheng-reason" class="w-full p-2 text-sm border border-amber-300 rounded focus:ring-2 focus:ring-amber-500 resize-none h-16" placeholder="原因..."></textarea>
                        </div>
                    </div>

                    <div id="field-confirm" class="hidden p-3 bg-amber-50 rounded-lg border border-amber-200 mt-4 transition-all">
                        <label class="flex items-center font-bold text-amber-900 cursor-pointer">
                            <input type="checkbox" id="edit-confirm-correct" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500" onchange="validateDrawerForm()"> 
                            <span class="ml-2 text-sm">確認以上資訊正確</span>
                        </label>
                    </div>
                </div>

                <div id="form-marriage" class="hidden space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">關係狀態</label>
                        <select id="edit-m-status" class="w-full p-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" onchange="toggleMarriageFields()">
                            <option value="存續">婚姻存續 (實線)</option>
                            <option value="無">無/離婚/分居 (中斷線)</option>
                        </select>
                    </div>

                    <div id="field-m-age" class="hidden">
                        <label id="label-m-age-text" class="block text-sm font-medium text-gray-700 mb-1">分開當時「我」幾歲？</label>
                        <input type="text" id="edit-m-age" class="w-full p-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="例如: 10, 或是 國小">
                    </div>
                </div>

            </div>
            
            <div class="p-5 border-t bg-gray-50 flex flex-col space-y-3 shrink-0">
                <button id="btn-save-drawer" onclick="saveDrawer()" class="w-full py-2.5 bg-blue-600 text-white font-medium rounded-lg shadow-sm hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 transition disabled:bg-gray-400 disabled:hover:bg-gray-400 disabled:cursor-not-allowed">確認儲存</button>
                <button id="btn-delete-node" onclick="deleteCurrentNode()" class="w-full py-2 text-sm text-red-600 font-medium border border-red-200 rounded-lg hover:bg-red-50 transition hidden">🗑️ 刪除此成員</button>
            </div>
        </aside>

    </div>

    <!-- 專屬提示視窗 -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 z-[100] hidden flex-col items-center justify-center transition-opacity opacity-0 backdrop-blur-sm no-print">
        <div id="custom-modal-content" class="bg-white rounded-xl shadow-2xl w-80 p-6 transform scale-95 transition-transform duration-200 flex flex-col">
            <h3 id="custom-modal-title" class="text-lg font-bold text-gray-900 mb-2">提示</h3>
            <p id="custom-modal-message" class="text-sm text-gray-600 mb-6 leading-relaxed">訊息內容</p>
            <div class="flex justify-end space-x-3 mt-auto">
                <button id="custom-modal-cancel" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition">取消</button>
                <button id="custom-modal-confirm" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition">確定</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA & HISTORY STATE ---
        const getNewId = () => 'id_' + Math.random().toString(36).substr(2, 9);

        const defaultState = {
            paternal: {
                husband: { id: 'pg_h', type: 'male', status: 'alive', age: '', isGP: true, isWaishengren: false, waishengrenReason: '', isConfirmed: false },
                wife: { id: 'pg_w', type: 'female', status: 'alive', age: '', isGP: true, isWaishengren: false, waishengrenReason: '', isConfirmed: false },
                marriage: { status: '存續', divorceAge: '', relation: '祖父母' },
                children: [{ id: 'father', type: 'male', status: 'alive', age: '', isMain: true, role: 'father', relationOption: 'main', isConfirmed: false }]
            },
            maternal: {
                husband: { id: 'mg_h', type: 'male', status: 'alive', age: '', isGP: true, isWaishengren: false, waishengrenReason: '', isConfirmed: false },
                wife: { id: 'mg_w', type: 'female', status: 'alive', age: '', isGP: true, isWaishengren: false, waishengrenReason: '', isConfirmed: false },
                marriage: { status: '存續', divorceAge: '', relation: '外祖父母' },
                children: [{ id: 'mother', type: 'female', status: 'alive', age: '', isMain: true, role: 'mother', relationOption: 'main', isConfirmed: false }]
            },
            client: {
                marriage: { status: '存續', divorceAge: '', relation: '父母' },
                children: [{ id: 'client_node', type: 'star', status: 'alive', age: '', isMain: true, role: 'client', relationOption: 'main', isConfirmed: false }]
            },
            clientFamily: {
                spouse: null,
                marriage: { status: '存續', divorceAge: '', relation: '案主婚姻' },
                children: [] 
            },
            global: { majorEvents: '', hiddenPeople: '', clientName: '' } 
        };

        let state = JSON.parse(JSON.stringify(defaultState));
        
        const savedDraft = localStorage.getItem('genogram_draft');
        if (savedDraft) {
            try {
                const parsedData = JSON.parse(savedDraft);
                if(!parsedData.global) parsedData.global = { majorEvents: '', hiddenPeople: '', clientName: '' };
                if(parsedData.global.clientName === undefined) parsedData.global.clientName = '';
                
                if (parsedData.clientRelationships && !parsedData.clientFamily) {
                    parsedData.clientFamily = { spouse: null, marriage: { status: '存續', divorceAge: '', relation: '案主婚姻' }, children: [] };
                    if (parsedData.clientRelationships.length > 0) {
                        parsedData.clientFamily.spouse = parsedData.clientRelationships[0].partner;
                        if (parsedData.clientFamily.spouse) parsedData.clientFamily.spouse.role = 'spouse';
                        parsedData.clientFamily.children = parsedData.clientRelationships[0].children || [];
                        parsedData.clientFamily.marriage.status = (parsedData.clientRelationships[0].statusLabel && parsedData.clientRelationships[0].statusLabel.includes('離婚')) ? '無' : '存續';
                    }
                    delete parsedData.clientRelationships;
                }
                
                state = parsedData;
            } catch (e) {
                console.error("讀取草稿失敗，使用預設值", e);
            }
        }

        let historyStack = [];
        let historyIndex = -1;

        function pushHistory() {
            historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(JSON.stringify(state));
            historyIndex++;
            localStorage.setItem('genogram_draft', JSON.stringify(state));
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                state = JSON.parse(historyStack[historyIndex]);
                localStorage.setItem('genogram_draft', JSON.stringify(state)); 
                renderDOM();
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                state = JSON.parse(historyStack[historyIndex]);
                localStorage.setItem('genogram_draft', JSON.stringify(state)); 
                renderDOM();
            }
        }

        pushHistory();

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') { e.preventDefault(); undo(); }
                if (e.key === 'y') { e.preventDefault(); redo(); }
            }
        });

        function getDynamicFileName() {
            const clientName = state.global.clientName.trim() || '未命名';
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const dateString = `${yyyy}${mm}${dd}`;
            return `家系圖_${clientName}_${dateString}`;
        }

        const customModal = document.getElementById('custom-modal');
        const customModalContent = document.getElementById('custom-modal-content');
        const customModalTitle = document.getElementById('custom-modal-title');
        const customModalMessage = document.getElementById('custom-modal-message');
        const customModalCancel = document.getElementById('custom-modal-cancel');
        const customModalConfirm = document.getElementById('custom-modal-confirm');

        function showModal({ title = '提示', message, type = 'alert', confirmText = '確定', confirmColor = 'blue', onConfirm }) {
            customModalTitle.innerText = title;

            customModalConfirm.className = `px-4 py-2 text-sm font-medium text-white rounded-lg transition ` + 
                (confirmColor === 'red' ? 'bg-red-600 hover:bg-red-700 shadow-sm shadow-red-200' : 'bg-blue-600 hover:bg-blue-700 shadow-sm shadow-blue-200');
            customModalConfirm.innerText = confirmText;

            customModalConfirm.onclick = () => {
                closeModal();
                if (onConfirm) onConfirm();
            };

            if (type === 'confirm') {
                customModalCancel.style.display = 'block';
                customModalCancel.onclick = closeModal;
            } else {
                customModalCancel.style.display = 'none';
            }

            customModal.style.display = 'flex';
            customModal.classList.remove('hidden');
            
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    customModal.classList.remove('opacity-0');
                    customModalContent.classList.remove('scale-95');
                });

        function closeModal() {
            customModal.classList.add('opacity-0');
            customModalContent.classList.add('scale-95');

                customModal.classList.add('hidden');
                customModal.style.display = 'none';

        const viewport = document.getElementById('viewport');
        const zoomWrapper = document.getElementById('zoom-wrapper');
        
        let scale = 1;
        let panX = -800; 
        let panY = -150; 
        let isDragging = false;
        let startX, startY;

        let initialDistance = null;
        let initialScale = null;

        function applyTransform() {
            zoomWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            drawSVGLines();
        }

        viewport.addEventListener('mousedown', (e) => {
            if(e.target.closest('.node-container') || e.target.closest('.btn-interactive')) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            viewport.classList.add('cursor-grabbing');
            viewport.classList.remove('cursor-grab');
        });

        window.addEventListener('mousemove', (e) => {
            if(!isDragging) return;
            let newPanX = e.clientX - startX;
            let newPanY = e.clientY - startY;
            panX = Math.min(Math.max(newPanX, -2600), 800);
            panY = Math.min(Math.max(newPanY, -1800), 500);
            applyTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            viewport.classList.remove('cursor-grabbing');
            viewport.classList.add('cursor-grab');
        });

        viewport.addEventListener('wheel', (e) => {
            if(e.target.closest('#right-drawer') || e.target.closest('aside')) return;
            e.preventDefault();
            const zoomSensitivity = 0.002;
            const delta = -e.deltaY * zoomSensitivity;
            let newScale = Math.min(Math.max(0.4, scale + delta), 2.5);
            
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const unscaledX = (mouseX - panX) / scale;
            const unscaledY = (mouseY - panY) / scale;

            scale = newScale;
            panX = Math.min(Math.max(mouseX - unscaledX * scale, -2600), 800);
            panY = Math.min(Math.max(mouseY - unscaledY * scale, -1800), 500);
            applyTransform();
        }, {passive: false});

        viewport.addEventListener('touchstart', (e) => {
            if(e.target.closest('.node-container') || e.target.closest('.btn-interactive')) return;
            
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialScale = scale;
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            if(e.target.closest('.node-container') || e.target.closest('.btn-interactive')) return;
            e.preventDefault(); 
            
            if (e.touches.length === 1 && isDragging) {
                let newPanX = e.touches[0].clientX - startX;
                let newPanY = e.touches[0].clientY - startY;
                panX = Math.min(Math.max(newPanX, -2600), 800);
                panY = Math.min(Math.max(newPanY, -1800), 500);
                applyTransform();
            } else if (e.touches.length === 2 && initialDistance) {
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                
                const zoomDelta = currentDistance / initialDistance;
                scale = Math.min(Math.max(0.4, initialScale * zoomDelta), 2.5);
                applyTransform();
            }
        }, { passive: false });

        viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialDistance = null;
            }
            if (e.touches.length === 0) {
                isDragging = false;
            }
        });

        function zoomIn() { scale = Math.min(scale + 0.2, 2.5); applyTransform(); }
        function zoomOut() { scale = Math.max(scale - 0.2, 0.4); applyTransform(); }

        // --- RENDER LOGIC ---

        function isNodeIncomplete(node) {
            if (!node) return false;
            if (node.type === 'abortion' || node.type === 'miscarriage') {
                const hasNoReason = !node.deathReason || String(node.deathReason).trim() === '';
                return hasNoReason; 
            }
            if (node.status === 'dead') {
                const hasNoAge = node.age === '' || node.age === null || node.age === undefined;
                const hasNoReason = !node.deathReason || String(node.deathReason).trim() === '';
                return hasNoAge || hasNoReason; 
            } else {
                return !node.isConfirmed; 
            }
        }

        function renderShape(node, incomplete) {
            const size = 50;
            const strokeColor = "#1e3a8a"; 
            const glowClass = incomplete ? "glow-gold" : ""; 
            
            // 修正 2: 移除了原本包在最外層的 bg-white 與 rounded-full，讓陰影直接貼合圖形形狀，不會讓方形變成圓形底
            let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="overflow-visible relative z-0 ${glowClass}">`;
            
            if (node.type === 'male') {
                svg += `<rect x="6" y="6" width="38" height="38" fill="white" stroke="${strokeColor}" stroke-width="2.5" rx="2"/>`;
            } else if (node.type === 'female') {
                svg += `<circle cx="25" cy="25" r="19" fill="white" stroke="${strokeColor}" stroke-width="2.5"/>`;
            } else if (node.type === 'abortion') {
                svg += `<polygon points="25,6 6,44 44,44" fill="white" stroke="${strokeColor}" stroke-width="2.5" stroke-linejoin="round"/>`;
            } else if (node.type === 'star') {
                svg += `<polygon points="25,4 31,18 46,18 34,27 38,42 25,33 12,42 16,27 4,18 19,18" fill="white" stroke="${strokeColor}" stroke-width="2.5" stroke-linejoin="round"/>`;
            }

            if (node.status === 'dead' || node.type === 'abortion') {
                svg += `
                    <line x1="2" y1="2" x2="48" y2="48" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="48" y1="2" x2="2" y2="48" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
                `;
            }

            if (node.role === 'father') svg += `<text x="25" y="31" text-anchor="middle" fill="${strokeColor}" font-size="16" font-weight="bold">父</text>`;
            else if (node.role === 'mother') svg += `<text x="25" y="31" text-anchor="middle" fill="${strokeColor}" font-size="16" font-weight="bold">母</text>`;
            else if (node.role === 'client') svg += `<text x="25" y="31" text-anchor="middle" fill="${strokeColor}" font-size="16" font-weight="bold">我</text>`;
            else if (node.role === 'spouse') svg += `<text x="25" y="31" text-anchor="middle" fill="${strokeColor}" font-size="16" font-weight="bold">配</text>`;

            svg += `</svg>`;
            return svg;
        }

        function renderNodeHTML(node, group) {
            let infoText = "";
            let textClass = "text-gray-700";
            const incomplete = isNodeIncomplete(node);

            if (node.type === 'abortion' || node.status === 'dead') {
                textClass = "text-red-700 font-bold";
                if (node.age) infoText += `(${node.age}歲)`;
                if (node.deathReason) infoText += `<div class="text-[10px] text-red-600 font-normal mt-1 leading-snug break-words w-full whitespace-pre-wrap">${node.deathReason}</div>`;
            } else {
                infoText = node.age ? `${node.age}歲` : ``;
            }

            let gpText = "";
            if (node.isGP && node.isWaishengren) {
                gpText = `<div class="absolute -right-8 top-0 text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded shadow-sm border border-amber-200">外省背景</div>`;
            }

            let relationLabel = "";
            const roleMap = {
                'older_brother': '哥哥', 'older_sister': '姊姊', 'younger_brother': '弟弟', 'younger_sister': '妹妹',
                'son': '兒子', 'daughter': '女兒'
            };
            if (node.relationOption && roleMap[node.relationOption]) {
                relationLabel = `<div class="absolute -top-7 left-1/2 -translate-x-1/2 text-[10px] font-bold text-gray-500 bg-white px-1.5 py-0.5 rounded border border-gray-200 shadow-sm whitespace-nowrap z-10">${roleMap[node.relationOption]}</div>`;
            }

            let extraClasses = "";
            if (node.role === 'father' || node.role === 'mother' || node.role === 'client' || node.role === 'spouse') {

            }

            return `
                <div class="node-container flex flex-col items-center cursor-pointer relative ${extraClasses}" id="node-${node.id}" onclick="openDrawer('node', '${group}', '${node.id}')">

                        ${infoText}

        function renderManageButton(group, position = 'right') {
            const labelText = group === 'clientFamily' ? '排列子女順序' : '排列手足順序';

                    <svg class="w-5 h-5 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>

            const getMLabel = (m, group) => {
                let relation = m.relation;
                if (!relation) {
                    if (group === 'paternal') relation = '祖父母';
                    else if (group === 'maternal') relation = '外祖父母';
                    else if (group === 'client') relation = '父母';
                    else if (group === 'clientFamily') relation = '案主婚姻';
                }
                if (m.status === '存續') return relation;
                if (!m.divorceAge) return `${relation} (分開/中斷)`;
                
                let subject = "";
                if (group === 'client' || group === 'clientFamily') subject = "我";
                else if (group === 'paternal') subject = "爸爸";
                else if (group === 'maternal') subject = "媽媽";
                
                let ageStr = String(m.divorceAge).trim();
                if (/^\d+$/.test(ageStr)) ageStr += "歲";
                return `${relation} (分開時${subject}${ageStr})`;
            };

            document.getElementById('label-pg-marriage').innerText = getMLabel(state.paternal.marriage, 'paternal');
            document.getElementById('label-mg-marriage').innerText = getMLabel(state.maternal.marriage, 'maternal');
            document.getElementById('label-parents-marriage').innerText = getMLabel(state.client.marriage, 'client');
            
            const clientMarriageLabel = document.getElementById('label-client-marriage');
            if (state.clientFamily.spouse) {
                clientMarriageLabel.style.display = 'block';
                clientMarriageLabel.innerText = getMLabel(state.clientFamily.marriage, 'clientFamily');

            setTimeout(drawSVGLines, 20);

        // 修正 1: 徹底棄用 getBoundingClientRect，強制使用 offsetLeft / offsetTop 迴圈讀取原生物件位置，免於任何縮放、列印模式、位移的干擾，保證線條 100% 接合！
        function drawSVGLines() {
            const svg = document.getElementById('svg-lines');
            const drawArea = document.getElementById('draw-area');
            if (!svg || !drawArea) return;
            let paths = '';

            const getLocalCenter = (elId) => {
                const el = document.getElementById(elId);
                if (!el) return null;

                let x = 0, y = 0, current = el;
                // 往上遞迴累加偏移量，完全不受 transform scale 干擾
                while (current && current !== drawArea && current !== document.body) {
                    x += current.offsetLeft;
                    y += current.offsetTop;
                    current = current.offsetParent;
                }
                return { 
                    x: x + (el.offsetWidth / 2), 
                    y: y + 25, 
                    top: y + 6 
                };
            };

            const drawFamilyLines = (n1Id, n2Id, childrenIds, labelId, mStatus, dropExtraLength = 0) => {
                const n1 = getLocalCenter('node-' + n1Id);
                const n2 = getLocalCenter('node-' + n2Id);
                if (!n1 || !n2) return;

                const strokeProps = mStatus === '存續' ? `stroke="#1e3a8a" stroke-width="3"` : `stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"`;
                const flatY = (n1.y + n2.y) / 2;

                paths += `<line x1="${n1.x}" y1="${flatY}" x2="${n2.x}" y2="${flatY}" ${strokeProps} />`;
                
                const midX = (n1.x + n2.x) / 2;
                const midY = flatY; 

                const labelEl = document.getElementById(labelId);
                if (labelEl) {
                    labelEl.style.left = `${midX}px`;
                    labelEl.style.top = `${midY - 12}px`;
                    labelEl.style.transform = 'translate(-50%, -100%)';
                }

                let targets = childrenIds.map(id => getLocalCenter('node-' + id)).filter(Boolean);
                if (targets.length === 0) return;

                const minChildTop = Math.min(...targets.map(t => t.top));
                const dropY = minChildTop - 35 - dropExtraLength; 
                
                paths += `<line x1="${midX}" y1="${midY}" x2="${midX}" y2="${dropY}" stroke="#1e3a8a" stroke-width="2.5" />`;

                const firstX = Math.min(...targets.map(t => t.x), midX);
                const lastX = Math.max(...targets.map(t => t.x), midX);
                paths += `<line x1="${firstX}" y1="${dropY}" x2="${lastX}" y2="${dropY}" stroke="#1e3a8a" stroke-width="2.5" />`;

                targets.forEach(t => {
                    paths += `<line x1="${t.x}" y1="${dropY}" x2="${t.x}" y2="${t.top}" stroke="#1e3a8a" stroke-width="2.5" />`;
                });
            };

            const pIds = state.paternal.children.map(c => c.id);
            drawFamilyLines('pg_h', 'pg_w', pIds, 'label-pg-marriage', state.paternal.marriage.status);

            const mIds = state.maternal.children.map(c => c.id);
            drawFamilyLines('mg_h', 'mg_w', mIds, 'label-mg-marriage', state.maternal.marriage.status);

            const cIds = state.client.children.map(c => c.id);
            const fatherNode = state.paternal.children.find(c => c.role === 'father');
            const motherNode = state.maternal.children.find(c => c.role === 'mother');
            if (fatherNode && motherNode) {
                drawFamilyLines(fatherNode.id, motherNode.id, cIds, 'label-parents-marriage', state.client.marriage.status, 20);
            }

            if (state.clientFamily.spouse) {
                const cfIds = state.clientFamily.children.map(c => c.id);
                const clientNode = state.client.children.find(c => c.role === 'client');
                if (clientNode) {
                    drawFamilyLines(clientNode.id, state.clientFamily.spouse.id, cfIds, 'label-client-marriage', state.clientFamily.marriage.status, 20);
                }
            }

            svg.innerHTML = paths;
        }

        window.addEventListener('resize', drawSVGLines);

        // --- DRAWER & DATA EDITING ---

        const formMarriage = document.getElementById('form-marriage');
        const formSiblings = document.getElementById('form-siblings');
        const drawerTitle = document.getElementById('drawer-title');

        let currentEditMode = null; 
        let currentEditGroup = null;
        let currentEditNodeData = null; 

        window.validateDrawerForm = function() {
            const saveBtn = document.getElementById('btn-save-drawer');
            if (currentEditMode === 'node') {
                const status = document.querySelector('input[name="edit-status"]:checked')?.value || 'alive';
                const type = document.getElementById('edit-type').value;
                let isAlive = status === 'alive';
                
                if (currentEditNodeData && (currentEditNodeData.role === 'client' || currentEditNodeData.role === 'spouse')) {
                    isAlive = true;
                }
                if (type === 'abortion' || type === 'miscarriage') {
                    isAlive = false;
                }

                if (isAlive) {
                    const isConfirmed = document.getElementById('edit-confirm-correct').checked;
                    saveBtn.disabled = !isConfirmed;
                } else {
                    if (type === 'abortion' || type === 'miscarriage') {
                        const reason = document.getElementById('edit-dead-reason').value.trim();
                        saveBtn.disabled = (reason === '');
                    } else {
                        saveBtn.disabled = false;
                    }
                }
            } else {
                saveBtn.disabled = false;
            }

            if (saveBtn.disabled) {
                saveBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                saveBtn.classList.add('bg-gray-400', 'hover:bg-gray-400', 'cursor-not-allowed', 'opacity-70');
            } else {
                saveBtn.classList.remove('bg-gray-400', 'hover:bg-gray-400', 'cursor-not-allowed', 'opacity-70');
                saveBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
            }
        };

        window.openSiblingDrawer = function(group) {
            currentEditMode = 'siblings';
            currentEditGroup = group;
            backdrop.classList.remove('hidden');
            setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
            drawer.classList.remove('drawer-closed');
            drawer.classList.add('drawer-open');

            formNode.classList.add('hidden');
            formMarriage.classList.add('hidden');
            formSiblings.classList.remove('hidden');
            
            document.getElementById('btn-delete-node').classList.add('hidden'); 
            drawerTitle.innerText = group === 'clientFamily' ? "排列子女順序 (最多10位)" : "排列手足順序 (最多10位)";

            const container = document.getElementById('sibling-slots-container');
            container.innerHTML = '';

            let currentChildren = [...state[group].children];
            let mainLabel = "";
            if (group === 'paternal') mainLabel = "爸爸";
            else if (group === 'maternal') mainLabel = "媽媽";
            else if (group === 'client') mainLabel = "我 (案主)";

            let optionsHTML = '';
            if (group === 'clientFamily') {
                optionsHTML = `<option value="">(無)</option><option value="son">兒子</option><option value="daughter">女兒</option><option value="abortion">墮胎流產</option>`;
            } else {
                optionsHTML = `<option value="">(無)</option><option value="older_brother">哥哥</option><option value="older_sister">姊姊</option><option value="main">${mainLabel}</option><option value="younger_brother">弟弟</option><option value="younger_sister">妹妹</option><option value="abortion">墮胎流產</option>`;
            }

            for (let i = 0; i < 10; i++) {
                container.innerHTML += `
                    <div class="flex items-center space-x-3 bg-white p-2.5 rounded-lg border border-gray-200 shadow-sm">
                        <span class="text-xs font-bold text-gray-600 w-12 shrink-0 text-center">第 ${i+1} 位</span>
                        <select id="sibling-slot-${i}" class="w-full p-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 bg-gray-50 hover:bg-white transition cursor-pointer">
                            ${optionsHTML}
                        </select>
                    </div>
                `;
            }
            
            for (let i = 0; i < 10; i++) {
                let child = currentChildren[i] || null;
                let val = '';
                if (child) {
                    if (child.isMain || ['father', 'mother', 'client'].includes(child.role)) val = 'main';
                    else if (child.relationOption) val = child.relationOption;
                    else if (child.type === 'abortion') val = 'abortion';
                    else val = child.type === 'male' ? (group === 'clientFamily' ? 'son' : 'younger_brother') : (group === 'clientFamily' ? 'daughter' : 'younger_sister');
                }
                document.getElementById(`sibling-slot-${i}`).value = val;
            }

            validateDrawerForm();
        };

        window.openDrawer = function(mode, group, id = null, tempNodeData = null) {
            currentEditMode = mode;
            currentEditGroup = group;
            backdrop.classList.remove('hidden');
            setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
            drawer.classList.remove('drawer-closed');
            drawer.classList.add('drawer-open');

            if (mode === 'node') {
                formNode.classList.remove('hidden');
                formMarriage.classList.add('hidden');
                formSiblings.classList.add('hidden');
                
                if (tempNodeData) {
                    drawerTitle.innerText = "新增家庭成員 (未儲存)";
                    currentEditNodeData = tempNodeData;
                } else {
                    drawerTitle.innerText = "編輯家庭成員";
                    currentEditNodeData = getNodeRef(group, id);
                }
                loadNodeDataToForm();

            } else {
                formMarriage.classList.remove('hidden');
                formNode.classList.add('hidden');
                formSiblings.classList.add('hidden');
                document.getElementById('btn-delete-node').classList.add('hidden');
                drawerTitle.innerText = "編輯關係狀態";
                loadMarriageData();
                validateDrawerForm();
            }
        };

        function closeDrawer() {
            drawer.classList.remove('drawer-open');
            drawer.classList.add('drawer-closed');
            backdrop.classList.add('opacity-0');
            setTimeout(() => backdrop.classList.add('hidden'), 300);
        }

        function getNodeRef(group, id) {
            if (group === 'clientFamily') {
                if (state.clientFamily.spouse?.id === id) return state.clientFamily.spouse;
                return state.clientFamily.children.find(c => c.id === id);
            }
            if (state[group].husband?.id === id) return state[group].husband;
            if (state[group].wife?.id === id) return state[group].wife;
            return state[group].children.find(c => c.id === id);
        }

        function loadNodeDataToForm() {
            const node = currentEditNodeData;
            if (!node) return;

            document.getElementById('edit-type').value = node.type;
            document.querySelectorAll('input[name="edit-status"]').forEach(el => el.checked = (el.value === node.status));
            document.getElementById('edit-age').value = node.age || '';
            document.getElementById('edit-dead-reason').value = node.deathReason || '';
            document.getElementById('edit-confirm-correct').checked = !!node.isConfirmed;

            const optAbortion = document.getElementById('opt-abortion');
            const fieldStatus = document.getElementById('field-status');
            const forbidAbortion = node.isGP || ['client', 'spouse', 'father', 'mother'].includes(node.role);
            
            if (forbidAbortion) {
                optAbortion.disabled = true;
                optAbortion.hidden = true;
                if (document.getElementById('edit-type').value === 'abortion') {
                    document.getElementById('edit-type').value = (node.role === 'client' || node.role === 'spouse') ? 'star' : 'male';
                }
            } else {
                optAbortion.disabled = false;
                optAbortion.hidden = false;
            }

            if (node.role === 'client') {
                fieldStatus.style.display = 'none';
            } else {
                fieldStatus.style.display = 'block';
            }

            const gpField = document.getElementById('field-waishengren');
            if (node.isGP) {
                gpField.classList.remove('hidden');
                document.getElementById('edit-is-waisheng').checked = !!node.isWaishengren;
                document.getElementById('edit-waisheng-reason').value = node.waishengrenReason || '';
            } else {
                gpField.classList.add('hidden');
            }

            const isLockedGenderRole = node.isGP || ['father', 'mother'].includes(node.role);
            const isManagedSibling = node.relationOption && node.relationOption !== 'main';
            const typeSelect = document.getElementById('edit-type');
            const typeHint = document.getElementById('edit-type-hint');
            
            if (isLockedGenderRole || isManagedSibling) {
                typeSelect.disabled = true;
                typeSelect.classList.add('bg-gray-100');
                if (isManagedSibling) typeHint.classList.remove('hidden');
                else typeHint.classList.add('hidden');
            } else {
                typeSelect.disabled = false;
                typeSelect.classList.remove('bg-gray-100');
                typeHint.classList.add('hidden');
            }
            
            const delBtn = document.getElementById('btn-delete-node');
            const preventDeleteRoles = ['father', 'mother', 'client'];
            
            if (node.isGP || preventDeleteRoles.includes(node.role)) {
                delBtn.classList.add('hidden'); 
                delBtn.style.display = 'none';
            } else {
                delBtn.classList.remove('hidden');
                delBtn.style.display = 'block';
                if (node.isTempSpouse) {
                    delBtn.innerHTML = '取消新增';
                } else {
                    delBtn.innerHTML = '🗑️ 刪除此成員 (清空此格)';
                }
            }

            toggleNodeFields();
        }

        function toggleNodeFields() {
            const type = document.getElementById('edit-type').value;
            let status = document.querySelector('input[name="edit-status"]:checked')?.value || 'alive';
            
            if (currentEditNodeData && currentEditNodeData.role === 'client') status = 'alive';

            const fieldAge = document.getElementById('field-age');
            const deadField = document.getElementById('field-dead-reason');
            const ageLabel = document.getElementById('label-edit-age');
            const deadLabel = document.getElementById('label-dead-reason');
            const fieldConfirm = document.getElementById('field-confirm');

            if (type === 'abortion' || type === 'miscarriage') {
                document.querySelector('input[name="edit-status"][value="dead"]').checked = true;
                status = 'dead';
                document.querySelectorAll('input[name="edit-status"]').forEach(el => el.disabled = true);
                
                fieldAge.classList.add('hidden');
                deadField.classList.remove('hidden'); 
                if(deadLabel) deadLabel.innerHTML = '流產/墮胎 原因 <span class="text-red-700 font-bold">(必填)</span>';
                fieldConfirm.classList.add('hidden');
            } else {
                document.querySelectorAll('input[name="edit-status"]').forEach(el => el.disabled = false);
                fieldAge.classList.remove('hidden');
                
                if (status === 'dead') {
                    deadField.classList.remove('hidden');
                    if(deadLabel) deadLabel.innerHTML = '離世 原因';
                    ageLabel.innerHTML = '<span class="text-red-700 font-bold">離世年齡</span> (供圖面顯示)';
                    fieldConfirm.classList.add('hidden');
                } else {
                    deadField.classList.add('hidden');
                    ageLabel.innerHTML = '目前年齡 (供圖面顯示)';
                    fieldConfirm.classList.remove('hidden');
                }
            }

            const isWaisheng = document.getElementById('edit-is-waisheng').checked;
            const wReason = document.getElementById('field-waisheng-reason');
            if (isWaisheng) wReason.classList.remove('hidden');
            else wReason.classList.add('hidden');

            validateDrawerForm();
        }

        function loadMarriageData() {
            const m = state[currentEditGroup].marriage;
            document.getElementById('edit-m-status').value = m.status;
            document.getElementById('edit-m-age').value = m.divorceAge || '';
            
            const ageLabelText = document.getElementById('label-m-age-text');
            if (currentEditGroup === 'client' || currentEditGroup === 'clientFamily') {
                ageLabelText.innerText = '分開當時「我」幾歲？';
            } else if (currentEditGroup === 'paternal') {
                ageLabelText.innerText = '分開當時「爸爸」幾歲？';
            } else if (currentEditGroup === 'maternal') {
                ageLabelText.innerText = '分開當時「媽媽」幾歲？';
            }

            toggleMarriageFields();
        }

        function toggleMarriageFields() {
            const status = document.getElementById('edit-m-status').value;
            const ageField = document.getElementById('field-m-age');
            if (status === '無') ageField.classList.remove('hidden');
            else ageField.classList.add('hidden');
        }

        function saveDrawer() {
            if (currentEditMode === 'siblings') {
                const newChildren = [];
                let mainCount = 0;
                
                for (let i = 0; i < 10; i++) {
                    const val = document.getElementById(`sibling-slot-${i}`).value;
                    if (val === '') continue; 
                    if (val === 'main') mainCount++;

                    let matchedChild = null;
                    let existingChild = state[currentEditGroup].children[i]; 

                    if (val === 'main') {
                        matchedChild = state[currentEditGroup].children.find(c => c.isMain || ['father', 'mother', 'client'].includes(c.role));
                        if (!matchedChild) {
                            matchedChild = { id: getNewId(), status: 'alive', age: '', deathReason: '', isMain: true, role: currentEditGroup === 'paternal' ? 'father' : (currentEditGroup === 'maternal' ? 'mother' : 'client'), isConfirmed: false };
                            if (currentEditGroup === 'paternal') matchedChild.type = 'male';
                            if (currentEditGroup === 'maternal') matchedChild.type = 'female';
                            if (currentEditGroup === 'client') matchedChild.type = 'star';
                        }
                    } else if (existingChild && (existingChild.relationOption === val || (val==='abortion' && existingChild.type==='abortion'))) {
                        matchedChild = existingChild;
                    } else {
                        matchedChild = state[currentEditGroup].children.find(c => (c.relationOption === val || (val==='abortion' && c.type==='abortion')) && !newChildren.includes(c));
                        if (!matchedChild) {
                            matchedChild = { id: getNewId(), status: val === 'abortion' ? 'dead' : 'alive', age: '', deathReason: '', isConfirmed: false };
                        }
                    }
                    
                    matchedChild.relationOption = val;
                    if (val === 'older_brother' || val === 'younger_brother' || val === 'son') matchedChild.type = 'male';
                    else if (val === 'older_sister' || val === 'younger_sister' || val === 'daughter') matchedChild.type = 'female';
                    else if (val === 'abortion') matchedChild.type = 'abortion';

                    newChildren.push(matchedChild);
                }

                if (currentEditGroup !== 'clientFamily' && mainCount !== 1) {
                    showModal({ title: '儲存失敗', message: '此世代必須包含且僅能包含一位「主角」(爸爸/媽媽/我)，請檢查下拉選單！', type: 'alert' });
                    return;
                }

                state[currentEditGroup].children = newChildren;

            } else if (currentEditMode === 'node') {
                const node = currentEditNodeData;
                if (node) {
                    const isLockedGenderRole = node.isGP || ['father', 'mother'].includes(node.role);
                    const isManagedSibling = node.relationOption && node.relationOption !== 'main';
                    
                    if (!isLockedGenderRole && !isManagedSibling) {
                        node.type = document.getElementById('edit-type').value;
                    }

                    node.age = document.getElementById('edit-age').value;
                    node.isConfirmed = document.getElementById('edit-confirm-correct').checked;

                    if (node.role === 'client') {
                        node.status = 'alive';
                        node.deathReason = '';
                    } else {
                        node.status = document.querySelector('input[name="edit-status"]:checked').value;
                        node.deathReason = (node.status === 'dead' || node.type === 'abortion' || node.type === 'miscarriage') ? document.getElementById('edit-dead-reason').value : '';
                    }

                    if (node.isGP) {
                        node.isWaishengren = document.getElementById('edit-is-waisheng').checked;
                        node.waishengrenReason = document.getElementById('edit-waisheng-reason').value;
                    }

                    if (node.isTempSpouse) {
                        delete node.isTempSpouse;
                        state.clientFamily.spouse = node;
                    }
                }
            } else {
                const m = state[currentEditGroup].marriage;
                m.status = document.getElementById('edit-m-status').value;
                m.divorceAge = m.status === '無' ? document.getElementById('edit-m-age').value : '';
            }

            pushHistory();
            closeDrawer();
            renderDOM();
        }

        function addSpouse() {
            const tempSpouse = { 
                id: 'client_spouse', type: 'star', status: 'alive', age: '', 
                isMain: true, role: 'spouse', isConfirmed: false, isTempSpouse: true 
            };
            openDrawer('node', 'clientFamily', null, tempSpouse);
        }

        function deleteCurrentNode() {
            const node = currentEditNodeData;
            if (!node) return;
            
            if (node.isTempSpouse) {
                closeDrawer();
                return;
            }

            showModal({
                title: '移除成員',
                message: '確定要移除這名成員嗎？<br>移除後將無法復原。',
                type: 'confirm',
                confirmText: '確定移除',
                confirmColor: 'red',
                onConfirm: () => {
                    if (node.role === 'spouse') {
                        state.clientFamily.spouse = null;
                        state.clientFamily.children = []; 
                    } else {
                        const idx = state[currentEditGroup].children.findIndex(c => c.id === node.id);
                        if (idx > -1) {
                            state[currentEditGroup].children.splice(idx, 1);
                        }
                    }
                    pushHistory();
                    closeDrawer();
                    renderDOM();
                }
            });
        }

        function updateGlobal() {
            state.global.majorEvents = document.getElementById('global-events').value;
            state.global.hiddenPeople = document.getElementById('global-hidden').value;
            state.global.clientName = document.getElementById('client-name').value;
            pushHistory();
        }

        function clearAll() {
            showModal({
                title: '清空重置',
                message: '即將清空所有自訂資料並恢復預設結構，確定嗎？<br><span class="text-xs text-red-500">注意：此操作也會同步清除瀏覽器中的暫存草稿。</span>',
                type: 'confirm',
                confirmText: '確定清空',
                confirmColor: 'red',
                onConfirm: () => {
                    state = JSON.parse(JSON.stringify(defaultState));
                    localStorage.removeItem('genogram_draft'); 
                    pushHistory();
                    renderDOM();
                }
            });
        }

        // ==========================================
        // 核心進化：動態包絡盒 PDF 列印 (保證完整不破版)
        // ==========================================
        function exportPDF() {
            const originalTitle = document.title;
            document.title = getDynamicFileName(); 

            // 修正 3：在列印前將側邊欄的文字記錄注入到專屬列印區塊內
            document.getElementById('print-events-text').innerText = document.getElementById('global-events').value || '無記錄';
            document.getElementById('print-hidden-text').innerText = document.getElementById('global-hidden').value || '無記錄';

            const drawArea = document.getElementById('draw-area');
            const nodes = Array.from(document.querySelectorAll('.node-container'));
            const labels = Array.from(document.querySelectorAll('[id^="label-"]'));
            const elements = [...nodes, ...labels].filter(el => el.style.display !== 'none');

            if (elements.length === 0) {
                window.print();
                return;
            }

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            elements.forEach(el => {
                let x = 0, y = 0, curr = el;
                while (curr && curr !== drawArea && curr !== document.body) {
                    x += curr.offsetLeft;
                    y += curr.offsetTop;
                    curr = curr.offsetParent;
                }
                
                let w = el.offsetWidth;
                let h = el.offsetHeight;
                let actualX = x;
                let actualY = y;

                if (el.id && el.id.startsWith('label-')) {
                    actualX -= w / 2;
                    actualY -= h;
                }

                minX = Math.min(minX, actualX);
                minY = Math.min(minY, actualY);
                maxX = Math.max(maxX, actualX + w);
                maxY = Math.max(maxY, actualY + h);
            });

            // 加上安全留白
            const paddingX = 80;
            const paddingY = 80;
            minX -= paddingX;
            minY -= paddingY;
            maxX += paddingX;
            maxY += paddingY;

            const contentW = maxX - minX;
            const contentH = maxY - minY;

            // A4 橫向的安全列印可視範圍
            const printSafeW = 1080; 
            const printSafeH = 750;

            const fitScale = Math.min(printSafeW / contentW, printSafeH / contentH);

            const offsetX = (printSafeW - (contentW * fitScale)) / 2;
            const offsetY = (printSafeH - (contentH * fitScale)) / 2;

            const zw = document.getElementById('zoom-wrapper');
            const origTransform = zw.style.transform;
            const origOrigin = zw.style.transformOrigin;

            // 套用動態計算後的精準 Transform
            zw.style.transformOrigin = 'top left';
            zw.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${fitScale}) translate(${-minX}px, ${-minY}px)`;

            setTimeout(() => {
                window.print();
                
                document.title = originalTitle; 
                zw.style.transform = origTransform;
                zw.style.transformOrigin = origOrigin || '';
            }, 100);
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `${getDynamicFileName()}.json`);
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loaded = JSON.parse(e.target.result);
                    if (loaded && loaded.paternal && loaded.client) {
                        
                        if (loaded.paternal.marriage && !loaded.paternal.marriage.relation) loaded.paternal.marriage.relation = '祖父母';
                        if (loaded.maternal.marriage && !loaded.maternal.marriage.relation) loaded.maternal.marriage.relation = '外祖父母';
                        if (loaded.client.marriage && !loaded.client.marriage.relation) loaded.client.marriage.relation = '父母';
                        
                        if (loaded.clientRelationships && !loaded.clientFamily) {
                            loaded.clientFamily = { spouse: null, marriage: { status: '存續', divorceAge: '', relation: '案主婚姻' }, children: [] };
                            if (loaded.clientRelationships.length > 0) {
                                loaded.clientFamily.spouse = loaded.clientRelationships[0].partner;
                                if (loaded.clientFamily.spouse) loaded.clientFamily.spouse.role = 'spouse';
                                loaded.clientFamily.children = loaded.clientRelationships[0].children || [];
                                loaded.clientFamily.marriage.status = (loaded.clientRelationships[0].statusLabel && loaded.clientRelationships[0].statusLabel.includes('離婚')) ? '無' : '存續';
                            }
                            delete loaded.clientRelationships;
                        }

                        if(!loaded.clientFamily) loaded.clientFamily = defaultState.clientFamily;
                        if(!loaded.global) loaded.global = { majorEvents: '', hiddenPeople: '', clientName: '' };
                        if(loaded.global.clientName === undefined) loaded.global.clientName = '';
                        state = loaded;
                        pushHistory();
                        renderDOM();
                    } else {
                        showModal({ title: '匯入失敗', message: '無效的檔案格式', type: 'alert' });
                    }
                } catch (err) { 
                    showModal({ title: '匯入失敗', message: '讀取檔案失敗', type: 'alert' });
                }
            };
            reader.readAsText(file);
        }

        window.onload = renderDOM;

    </script>
