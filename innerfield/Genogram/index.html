        function saveDrawer() {
            if (currentEditMode === 'siblings') {
                const newChildren = [];
                let mainCount = 0;
                
                let targetArray;
                if (currentEditGroup === 'clientFamilies') targetArray = state.clientFamilies.find(f => f.id === currentEditFamilyId).children;
                else if (currentEditGroup === 'fatherFamilies') targetArray = state.fatherFamilies.find(f => f.id === currentEditFamilyId).children;
                else if (currentEditGroup === 'motherFamilies') targetArray = state.motherFamilies.find(f => f.id === currentEditFamilyId).children;
                else targetArray = state[currentEditGroup].children;
                
                for (let i = 0; i < 20; i++) {
                    const val = document.getElementById(`sibling-slot-${i}`).value;
                    if (val === '') continue; 
                    if (val === 'main') mainCount++;

                    let matchedChild = null;
                    let existingChild = targetArray[i]; 

                    if (val === 'main') {
                        matchedChild = targetArray.find(c => c.isMain || ['father', 'mother', 'client'].includes(c.role));
                        if (!matchedChild) {
                            matchedChild = { id: getNewId(), status: 'alive', age: '', deathReason: '', isMain: true, role: currentEditGroup === 'paternal' ? 'father' : (currentEditGroup === 'maternal' ? 'mother' : 'client'), isConfirmed: false, adoptionStatus: 'none', otherSystemNotes: '', personNote: '', isWaishengren: false, waishengrenReason: '' };
                            if (currentEditGroup === 'paternal') matchedChild.type = 'male';
                            if (currentEditGroup === 'maternal') matchedChild.type = 'female';
                            if (currentEditGroup === 'client') matchedChild.type = 'star';
                        }
                    } else if (existingChild && (existingChild.relationOption === val || (val==='abortion' && existingChild.type==='abortion'))) {
                        matchedChild = existingChild;
                    } else {
                        matchedChild = targetArray.find(c => (c.relationOption === val || (val==='abortion' && c.type==='abortion')) && !newChildren.includes(c));
                        if (!matchedChild) {
                            matchedChild = { id: getNewId(), status: val === 'abortion' ? 'dead' : 'alive', age: '', deathReason: '', personNote: '', isConfirmed: false, adoptionStatus: 'none', otherSystemNotes: '', personNote: '' };
                        }
                    }
                    
                    matchedChild.relationOption = val;
                    if (val === 'older_brother' || val === 'younger_brother' || val === 'son') matchedChild.type = 'male';
                    else if (val === 'older_sister' || val === 'younger_sister' || val === 'daughter') matchedChild.type = 'female';
                    else if (val === 'abortion') matchedChild.type = 'abortion';

                    newChildren.push(matchedChild);
                }

                if ((currentEditGroup !== 'clientFamilies' && currentEditGroup !== 'fatherFamilies' && currentEditGroup !== 'motherFamilies') && mainCount !== 1) {
                    showModal({ title: '儲存失敗', message: '此世代必須包含且僅能包含一位「主角」(爸爸/媽媽/我)，請檢查下拉選單！', type: 'alert' });
                    return;
                }

                if (currentEditGroup === 'clientFamilies') state.clientFamilies.find(f => f.id === currentEditFamilyId).children = newChildren;
                else if (currentEditGroup === 'fatherFamilies') state.fatherFamilies.find(f => f.id === currentEditFamilyId).children = newChildren;
                else if (currentEditGroup === 'motherFamilies') state.motherFamilies.find(f => f.id === currentEditFamilyId).children = newChildren;
                else state[currentEditGroup].children = newChildren;

            } else if (currentEditMode === 'node') {
                const node = currentEditNodeData;
                if (node) {
                    const isLockedGenderRole = node.isGP || ['father', 'mother'].includes(node.role);
                    const isManagedSibling = node.relationOption && node.relationOption !== 'main';
                    
                    if (!isLockedGenderRole && !isManagedSibling) {
                        node.type = document.getElementById('edit-type').value;
                    }

                    node.age = document.getElementById('edit-age').value;
                    node.personNote = String(document.getElementById('edit-person-note').value || '').slice(0, 20);
                    node.isConfirmed = document.getElementById('edit-confirm-correct').checked;
                    
                    node.adoptionStatus = document.getElementById('edit-adoption').value;
                    node.otherSystemNotes = document.getElementById('edit-adoption-notes').value;

                    node.status = document.querySelector('input[name="edit-status"]:checked')?.value || 'alive';
                    node.deathReason = (node.status === 'dead' || node.type === 'abortion' || node.type === 'miscarriage') ? document.getElementById('edit-dead-reason').value : '';
                    if (node.status === 'unknown') {
                        node.age = '';
                        node.isConfirmed = false;
                        node.deathReason = '';
                    }

                    if (node.isGP || ['father', 'mother'].includes(node.role)) {
                        node.isWaishengren = document.getElementById('edit-is-waisheng').checked;
                        node.waishengrenReason = document.getElementById('edit-waisheng-reason').value;
                    }

                    if (node.isTempSpouse) {
                        delete node.isTempSpouse;
                        if (currentEditGroup === 'clientFamilies') {
                            const numMap = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十'];
                            const numStr = numMap[state.clientFamilies.length] || (state.clientFamilies.length + 1);
                            state.clientFamilies.push({ id: currentEditFamilyId, spouse: node, marriage: { status: '存續', divorceReason: '', relation: `關係${numStr}`, isConfirmed: false }, children: [] });
                        } else if (currentEditGroup === 'fatherFamilies') {
                            const numMap = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十'];
                            const numStr = numMap[state.fatherFamilies.length] || (state.fatherFamilies.length + 1);
                            state.fatherFamilies.push({ id: currentEditFamilyId, spouse: node, marriage: { status: '存續', divorceAge: '', relation: `其他關係${numStr}`, isConfirmed: false }, children: [] });
                        } else if (currentEditGroup === 'motherFamilies') {
                            const numMap = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十'];
                            const numStr = numMap[state.motherFamilies.length] || (state.motherFamilies.length + 1);
                            state.motherFamilies.push({ id: currentEditFamilyId, spouse: node, marriage: { status: '存續', divorceAge: '', relation: `其他關係${numStr}`, isConfirmed: false }, children: [] });
                        }
                    }
                }
            } else {
                let m;
                if (currentEditGroup === 'clientFamilies') m = state.clientFamilies.find(f => f.id === currentEditFamilyId).marriage;
                else if (currentEditGroup === 'fatherFamilies') m = state.fatherFamilies.find(f => f.id === currentEditFamilyId).marriage;
                else if (currentEditGroup === 'motherFamilies') m = state.motherFamilies.find(f => f.id === currentEditFamilyId).marriage;
                else m = state[currentEditGroup].marriage;

                m.status = document.getElementById('edit-m-status').value;
                if (currentEditGroup === 'clientFamilies') {
                    m.divorceReason = m.status === '無' ? document.getElementById('edit-m-age').value : '';
                } else {
                    m.divorceAge = m.status === '無' ? document.getElementById('edit-m-age').value : '';
                }
                m.isConfirmed = document.getElementById('edit-m-confirm-correct').checked;
            }

            pushHistory();
            closeDrawer();
            renderDOM();
        }

        function addSpouse() {
            const newFamId = 'cf_' + getNewId();
            const tempSpouse = { 
                id: 'client_spouse_' + getNewId(), type: 'star', status: 'alive', age: '', personNote: '', 
                isMain: true, role: 'spouse', isConfirmed: false, isTempSpouse: true, adoptionStatus: 'none', otherSystemNotes: '' 
            };
            openDrawer('node', 'clientFamilies', null, tempSpouse, newFamId);
        }

        function addParentSpouse(target) {
            const isFather = target === 'father';
            const newFamId = (isFather ? 'ff_' : 'mf_') + getNewId();
            const tempSpouse = { 
                id: target + '_spouse_' + getNewId(), type: isFather ? 'female' : 'male', status: 'alive', age: '', personNote: '', 
                isMain: true, role: 'spouse', isConfirmed: false, isTempSpouse: true, adoptionStatus: 'none', otherSystemNotes: '' 
            };
            openDrawer('node', isFather ? 'fatherFamilies' : 'motherFamilies', null, tempSpouse, newFamId);
        }

        function deleteCurrentNode() {
            const node = currentEditNodeData;
            if (!node) return;
            
            if (node.isTempSpouse) {
                closeDrawer();
                return;
            }

            showModal({
                title: node.role === 'spouse' ? '移除關係紀錄' : '移除成員',
                message: node.role === 'spouse' 
                    ? '確定要移除這名伴侶與對應的關係嗎？<br><span class="text-red-500 text-xs">注意：這將會一併刪除這段關係下的所有子女！</span>'
                    : '確定要移除這名成員嗎？<br>移除後將無法復原。',
                type: 'confirm',
                confirmText: '確定移除',
                confirmColor: 'red',
                onConfirm: () => {
                    if (node.role === 'spouse') {
                        if (currentEditGroup === 'clientFamilies') state.clientFamilies = state.clientFamilies.filter(f => f.spouse.id !== node.id);
                        if (currentEditGroup === 'fatherFamilies') state.fatherFamilies = state.fatherFamilies.filter(f => f.spouse.id !== node.id);
                        if (currentEditGroup === 'motherFamilies') state.motherFamilies = state.motherFamilies.filter(f => f.spouse.id !== node.id);
                    } else {
                        if (currentEditGroup === 'clientFamilies' || currentEditGroup === 'fatherFamilies' || currentEditGroup === 'motherFamilies') {
                            let fams = state[currentEditGroup];
                            const fam = fams.find(f => f.id === currentEditFamilyId);
                            const idx = fam.children.findIndex(c => c.id === node.id);
                            if (idx > -1) fam.children.splice(idx, 1);
                        } else {
                            const idx = state[currentEditGroup].children.findIndex(c => c.id === node.id);
                            if (idx > -1) {
                                state[currentEditGroup].children.splice(idx, 1);
                            }
                        }
                    }
                    pushHistory();
                    closeDrawer();
                    renderDOM();
                }
            });
        }

        function updateGlobal() {
            state.global.majorEvents = document.getElementById('global-events').value;
            state.global.hiddenPeople = document.getElementById('global-hidden').value;
            state.global.otherNotes = document.getElementById('global-notes').value;
            state.global.expectation = document.getElementById('global-expectation').value;
            state.global.facilitatorNotes = document.getElementById('global-facilitator-notes').value;
            state.global.clientName = document.getElementById('client-name').value;
            pushHistory();
        }

        function clearAll() {
            showModal({
                title: '清空重置',
                message: '即將清空所有自訂資料並恢復預設結構，確定嗎？<br><span class="text-xs text-red-500">注意：此操作也會同步清除瀏覽器中的暫存草稿。</span>',
                type: 'confirm',
                confirmText: '確定清空',
                confirmColor: 'red',
                onConfirm: () => {
                    state = JSON.parse(JSON.stringify(defaultState));
                    localStorage.removeItem('genogram_draft'); 
                    pushHistory();
                    renderDOM();
                }
            });
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `${getDynamicFileName()}.json`);
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function syncGlobalFieldsWithoutHistory() {
            state.global.majorEvents = document.getElementById('global-events').value;
            state.global.hiddenPeople = document.getElementById('global-hidden').value;
            state.global.otherNotes = document.getElementById('global-notes').value;
            state.global.expectation = document.getElementById('global-expectation').value;
            state.global.facilitatorNotes = document.getElementById('global-facilitator-notes').value;
            state.global.clientName = document.getElementById('client-name').value;
            localStorage.setItem('genogram_draft', JSON.stringify(state));
        }

        function escapeHTML(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function waitForNextPaint() {
            return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }

        async function waitForPDFReady() {
            if (document.fonts && document.fonts.ready) {
                try {
                    await document.fonts.ready;
                } catch (_) {}
            }

            await waitForNextPaint();
            await waitForNextPaint();

            await new Promise(resolve => setTimeout(resolve, 150));
        }

        function normalizePDFLabelPositions(exportRoot) {
            const marriageLabels = exportRoot.querySelectorAll('[id^="label-"]');
            marriageLabels.forEach(label => {
                const left = parseFloat(label.style.left);
                const top = parseFloat(label.style.top);
                if (Number.isFinite(left) && Number.isFinite(top)) {
                    const w = label.offsetWidth || label.getBoundingClientRect().width || 0;
                    const h = label.offsetHeight || label.getBoundingClientRect().height || 0;
                    label.style.transform = 'none';
                    label.style.left = `${left - w / 2}px`;
                    label.style.top = `${top - h}px`;
                }
            });

            const relationLabels = exportRoot.querySelectorAll('.node-container > .absolute');
            relationLabels.forEach(label => {
                const classText = String(label.className || '');
                if (classText.includes('-top-7') && classText.includes('left-1/2')) {
                    const parent = label.parentElement;
                    const parentW = parent ? parent.offsetWidth : 0;
                    const w = label.offsetWidth || label.getBoundingClientRect().width || 0;
                    label.style.transform = 'none';
                    label.style.left = `${(parentW - w) / 2}px`;
                }
            });
        }

        function fitPDFChartToStage(exportRoot) {
            const stage = exportRoot.querySelector('.pdf-chart-stage');
            const drawArea = stage ? stage.querySelector('#draw-area') : null;
            if (!stage || !drawArea) return;

            drawArea.style.transform = 'none';
            drawArea.style.left = '0px';
            drawArea.style.top = '0px';

            const targets = Array.from(drawArea.querySelectorAll('.node-container, [id^="label-"]'))
                .filter(el => el.offsetParent !== null);

            const drawRect = drawArea.getBoundingClientRect();
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            targets.forEach(el => {
                const r = el.getBoundingClientRect();
                minX = Math.min(minX, r.left - drawRect.left);
                minY = Math.min(minY, r.top - drawRect.top);
                maxX = Math.max(maxX, r.right - drawRect.left);
                maxY = Math.max(maxY, r.bottom - drawRect.top);
            });

            if (!Number.isFinite(minX) || !Number.isFinite(minY) || maxX <= minX || maxY <= minY) return;

            const svg = drawArea.querySelector('#svg-lines');
            if (svg) {
                const lines = Array.from(svg.querySelectorAll('line, path, polyline'));
                lines.forEach(el => {
                    try {
                        const b = el.getBBox();
                        minX = Math.min(minX, b.x);
                        minY = Math.min(minY, b.y);
                        maxX = Math.max(maxX, b.x + b.width);
                        maxY = Math.max(maxY, b.y + b.height);
                    } catch (_) {}
                });
            }

            const padX = 36;
            const padY = 42;
            minX -= padX; minY -= padY; maxX += padX; maxY += padY;

            const contentW = maxX - minX;
            const contentH = maxY - minY;
            const stageW = stage.clientWidth;
            const stageH = stage.clientHeight;
            const fit = Math.min(stageW / contentW, stageH / contentH);
            const scale = Math.max(0.55, Math.min(1.55, fit));
            const tx = (stageW - contentW * scale) / 2 - minX * scale;
            const ty = (stageH - contentH * scale) / 2 - minY * scale;
            drawArea.style.transform = `matrix(${scale}, 0, 0, ${scale}, ${tx}, ${ty})`;
        }

        async function exportPDF() {
            try {
                if (!window.html2canvas || !window.jspdf) {
                    showModal({
                        title: '無法匯出 PDF',
                        message: 'PDF 匯出工具尚未載入完成。請確認網路連線後重新整理頁面，再試一次。',
                        type: 'alert'
                    });
                    return;
                }

                syncGlobalFieldsWithoutHistory();
                closeDrawer();
                drawSVGLines();
                await waitForNextPaint();

                const originalDrawArea = document.getElementById('draw-area');
                const clonedDrawArea = originalDrawArea.cloneNode(true);
                clonedDrawArea.style.marginTop = '0';
                clonedDrawArea.style.transform = 'none';
                clonedDrawArea.style.position = 'relative';

                // PDF 匯出：保留 glow-gold 金色閃爍提示效果。
                // 不移除 glow-gold、不停用 animation/filter；僅確保 SVG 外溢可見，避免圖樣被裁切。
                clonedDrawArea.querySelectorAll('svg').forEach(svg => {
                    svg.style.overflow = 'visible';
                });

                const exportRoot = document.createElement('div');
                exportRoot.className = 'pdf-export-root';

                const today = new Date();
                const dateText = `${today.getFullYear()}/${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
                const clientName = state.global.clientName && state.global.clientName.trim() ? state.global.clientName.trim() : '未命名';

                const noteItems = [
                    ['系統重大事件 / 糾葛', state.global.majorEvents],
                    ['被排除/遺忘的成員', state.global.hiddenPeople],
                    ['其他圖中沒有的註記', state.global.otherNotes],
                    ['期待收穫', state.global.expectation],
                    ['排列師整合釐清', state.global.facilitatorNotes]
                ];

                exportRoot.innerHTML = `
                    <div class="pdf-header">
                        <div class="pdf-title">家族系統圖</div>
                        <div class="pdf-meta">當事人：${escapeHTML(clientName)}　｜　匯出日期：${dateText}</div>
                    </div>
                    <div class="pdf-chart-wrap">
                        <div class="pdf-notes">
                            ${noteItems.map(([title, content]) => `
                                <section class="pdf-note-card">
                                    <div class="pdf-note-title">${escapeHTML(title)}</div>
                                    <div class="pdf-note-content">${escapeHTML(content || '（未填寫）')}</div>
                                </section>
                            `).join('')}
                        </div>
                        <div class="pdf-chart-stage"></div>
                    </div>
                `;
                exportRoot.querySelector('.pdf-chart-stage').appendChild(clonedDrawArea);
                document.body.appendChild(exportRoot);

                await waitForNextPaint();
                // PDF 使用複製後的 draw-area 重新計算線段，避免沿用螢幕版座標造成右側線段斷裂或偏移。
                redrawSVGLinesInDrawArea(clonedDrawArea);
                await waitForNextPaint();
                normalizePDFLabelPositions(exportRoot);
                await waitForNextPaint();
                fitPDFChartToStage(exportRoot);
                await waitForPDFReady();

                const canvas = await html2canvas(exportRoot, {
                    backgroundColor: '#fdfbf7',
                    scale: 3,
                    useCORS: true,
                    allowTaint: true,
                    windowWidth: exportRoot.scrollWidth,
                    windowHeight: exportRoot.scrollHeight
                });

                exportRoot.remove();

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const margin = 4;
                const usableWidth = pageWidth - margin * 2;
                const usableHeight = pageHeight - margin * 2;

                const imgData = canvas.toDataURL('image/png');
                const imgRatio = canvas.width / canvas.height;
                const pageRatio = usableWidth / usableHeight;

                let imgWidth = usableWidth;
                let imgHeight = usableHeight;
                let offsetX = margin;
                let offsetY = margin;

                if (imgRatio > pageRatio) {
                    imgHeight = usableWidth / imgRatio;
                    offsetY = margin + (usableHeight - imgHeight) / 2;
                } else {
                    imgWidth = usableHeight * imgRatio;
                    offsetX = margin + (usableWidth - imgWidth) / 2;
                }

                pdf.addImage(imgData, 'PNG', offsetX, offsetY, imgWidth, imgHeight, undefined, 'FAST');
                pdf.save(`${getDynamicFileName()}.pdf`);
            } catch (error) {
                console.error('PDF 匯出失敗：', error);
                const existingRoot = document.querySelector('.pdf-export-root');
                if (existingRoot) existingRoot.remove();
                showModal({
                    title: '匯出失敗',
                    message: 'PDF 產生時發生問題。請先儲存 JSON 備份，重新整理頁面後再試一次。',
                    type: 'alert'
                });
            }
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loaded = JSON.parse(e.target.result);
                    if (loaded && loaded.paternal && loaded.client) {
                        
                        if (loaded.paternal.marriage && !loaded.paternal.marriage.relation) loaded.paternal.marriage.relation = '祖父母';
                        if (loaded.maternal.marriage && !loaded.maternal.marriage.relation) loaded.maternal.marriage.relation = '外祖父母';
                        if (loaded.client.marriage && !loaded.client.marriage.relation) loaded.client.marriage.relation = '父母';
                        
                        if (loaded.clientFamily && !loaded.clientFamilies) {
                            loaded.clientFamilies = [];
                            if (loaded.clientFamily.spouse) {
                                loaded.clientFamily.id = 'cf_' + getNewId();
                                loaded.clientFamilies.push(loaded.clientFamily);
                            }
                            delete loaded.clientFamily;
                        } else if (loaded.clientRelationships && !loaded.clientFamilies) {
                            loaded.clientFamilies = [];
                            if (loaded.clientRelationships.length > 0) {
                                let cf = { id: 'cf_' + getNewId(), spouse: loaded.clientRelationships[0].partner, marriage: { status: '存續', divorceReason: '', relation: '關係一' }, children: loaded.clientRelationships[0].children || [] };
                                if (cf.spouse) cf.spouse.role = 'spouse';
                                cf.marriage.status = (loaded.clientRelationships[0].statusLabel && loaded.clientRelationships[0].statusLabel.includes('離')) ? '無' : '存續';
                                loaded.clientFamilies.push(cf);
                            }
                            delete loaded.clientRelationships;
                        }

                        if(!loaded.clientFamilies) loaded.clientFamilies = [];
                        if(!loaded.fatherFamilies) loaded.fatherFamilies = [];
                        if(!loaded.motherFamilies) loaded.motherFamilies = [];
                        if(!loaded.global) loaded.global = { majorEvents: '', hiddenPeople: '', otherNotes: '', expectation: '', facilitatorNotes: '', clientName: '' };
                        if(loaded.global.clientName === undefined) loaded.global.clientName = '';
                        if(loaded.global.otherNotes === undefined) loaded.global.otherNotes = '';
                        if(loaded.global.expectation === undefined) loaded.global.expectation = '';
                        if(loaded.global.facilitatorNotes === undefined) loaded.global.facilitatorNotes = '';
                        state = loaded;
                        pushHistory();
                        renderDOM();
                    } else {
                        showModal({ title: '匯入失敗', message: '無效的檔案格式', type: 'alert' });
                    }
                } catch (err) { 
                    showModal({ title: '匯入失敗', message: '讀取檔案失敗', type: 'alert' });
                }
            };
            reader.readAsText(file);
        }

        window.onload = function() {
            renderDOM();
            setTimeout(() => showUsageNotice(true), 300);
        };

    </script>
