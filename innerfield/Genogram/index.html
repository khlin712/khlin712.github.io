<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家族系統圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" referrerpolicy="no-referrer"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdfbf7;
            margin: 0;
            overflow: hidden; 
            overscroll-behavior: none; 
            touch-action: none; 
        }
        
        .notebook-bg {
            background-color: #f8fafc;
            background-image: 
                linear-gradient(#e2e8f0 1px, transparent 1px),
                linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 2rem 2rem;
            background-position: -1px -1px;
        }
        
        .node-container { transition: transform 0.15s ease, filter 0.15s ease; }
        .node-container:hover { transform: scale(1.1); z-index: 50; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }

        .drawer-open { transform: translateX(0); box-shadow: -10px 0 25px rgba(0,0,0,0.05); }
        .drawer-closed { transform: translateX(100%); }

        @keyframes goldGlow {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.7)); }
            50% { filter: drop-shadow(0 0 12px rgba(245, 158, 11, 1)); }
        }
        .glow-gold {
            animation: goldGlow 2s infinite ease-in-out;
        }


        @keyframes guideGreenBorderPulse {
            0%, 100% { border-color: #22c55e; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45), 0 0 10px rgba(34, 197, 94, 0.28); }
            50% { border-color: #16a34a; box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.10), 0 0 18px rgba(34, 197, 94, 0.55); }
        }
        .operation-guide-button {
            border: 2px solid #22c55e !important;
            animation: guideGreenBorderPulse 1.35s infinite ease-in-out;
        }
        .operation-guide-button:hover {
            background: #ecfdf5 !important;
        }

        /* 左側欄收合把手：加大可點擊範圍，收合後仍明顯露出 */
        .left-sidebar-toggle-handle {
            width: 42px;
            height: 86px;
            right: -34px;
            border-radius: 0 9999px 9999px 0;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #bfdbfe;
            border-left: 0;
            box-shadow: 0 10px 22px rgba(30, 64, 175, 0.18);
            color: #2563eb;
        }
        .left-sidebar-toggle-handle:hover {
            width: 48px;
            right: -40px;
            background: #eff6ff;
            color: #1d4ed8;
            box-shadow: 0 12px 28px rgba(30, 64, 175, 0.28);
        }
        .left-sidebar-toggle-handle:active {
            transform: translateY(-50%) scale(0.98);
        }
        .left-sidebar-toggle-handle .toggle-grip {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .left-sidebar-toggle-handle .toggle-grip span {
            width: 3px;
            height: 3px;
            border-radius: 9999px;
            background: currentColor;
            opacity: 0.45;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 頂部工具列可左右橫向捲動，避免小視窗時按鈕被擠出畫面 */
        .top-toolbar {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            gap: 1rem;
        }
        .top-toolbar > div {
            flex-shrink: 0;
        }
        .top-toolbar-scroll-hint {
            position: sticky;
            right: 0;
            width: 22px;
            align-self: stretch;
            flex: 0 0 22px;
            pointer-events: none;
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.96));
        }

        .pdf-export-root {
            position: fixed;
            left: -99999px;
            top: 0;
            width: 2200px;
            height: 1538px;
            background: #fdfbf7;
            color: #1f2937;
            padding: 14px 18px 16px;
            box-sizing: border-box;
            z-index: -1;
            overflow: hidden;
        }
        .pdf-export-root .pdf-header {
            display: flex;
            align-items: baseline;
            gap: 18px;
            height: 38px;
            margin-bottom: 8px;
        }
        .pdf-export-root .pdf-title {
            font-size: 25px;
            font-weight: 700;
            color: #1e3a8a;
            margin: 0;
            line-height: 1.1;
        }
        .pdf-export-root .pdf-meta {
            font-size: 25px;
            font-weight: 700;
            color: #1e3a8a;
            margin: 0;
            line-height: 1.1;
        }
        .pdf-export-root .pdf-chart-wrap {
            position: relative;
            height: calc(100% - 46px);
            background-color: #f8fafc;
            background-image:
                linear-gradient(#e2e8f0 1px, transparent 1px),
                linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 2rem 2rem;
            background-position: -1px -1px;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 0;
            overflow: hidden;
            box-sizing: border-box;
        }
        .pdf-export-root .pdf-notes {
            position: absolute;
            left: 18px;
            top: 18px;
            bottom: 18px;
            width: 335px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 80;
            pointer-events: none;
        }
        .pdf-export-root .pdf-note-card {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid #dbeafe;
            border-radius: 11px;
            padding: 10px 12px;
            flex: 1 1 0;
            min-height: 0;
            overflow: hidden;
            break-inside: avoid;
            box-sizing: border-box;
        }
        .pdf-export-root .pdf-note-title {
            font-size: 15px;
            font-weight: 700;
            color: #1e40af;
            margin-bottom: 5px;
            line-height: 1.25;
        }
        .pdf-export-root .pdf-note-content {
            font-size: 13px;
            line-height: 1.42;
            white-space: pre-wrap;
            color: #374151;
            overflow-wrap: anywhere;
        }
        .pdf-export-root .pdf-chart-stage {
            position: absolute;
            left: 375px;
            right: 18px;
            top: 18px;
            bottom: 18px;
            overflow: hidden;
        }
        .pdf-export-root .pdf-chart-stage > #draw-area {
            position: absolute !important;
            margin: 0 !important;
            left: 0;
            top: 0;
            transform-origin: 0 0 !important;
        }
        .pdf-export-root .hide-on-present {
            display: none !important;
        }
        .pdf-export-root .no-print,
        .pdf-export-root .btn-interactive {
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* PDF 匯出：所有「特別標示」保留框線，避免只剩文字而不易辨識 */
        .pdf-export-root [id^="label-"] {
            background: rgba(255,255,255,0.92) !important;
            border: 1px solid #93c5fd !important;
            box-shadow: 0 1px 2px rgba(30, 64, 175, 0.12) !important;
            padding: 2px 6px !important;
            border-radius: 5px !important;
        }
        .pdf-export-root [id^="label-"] span {
            background: transparent !important;
        }
        /* PDF 匯出：手足稱謂等小標籤只保留文字，移除框線、底色與陰影 */
        .pdf-export-root .node-container > .absolute[class*="-top-7"] {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
            border-radius: 0 !important;
        }


        /* 特別標示：外省背景、收養、出養，在操作版與 PDF 都加上框框 */
        .waisheng-label,
        .adoption-label {
            border-width: 1px !important;
            border-style: solid !important;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12) !important;
        }
        .pdf-export-root .waisheng-label,
        .pdf-export-root .adoption-label {
            background: rgba(255,255,255,0.94) !important;
            border-color: #f59e0b !important;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.10) !important;
            padding: 4px 6px !important;
            border-radius: 6px !important;
        }
        .pdf-export-root .adoption-label {
            border-color: #8b5cf6 !important;
        }
        .pdf-export-root .waisheng-label .label-badge,
        .pdf-export-root .adoption-label .label-badge {
            padding: 0 2px !important;
            border-radius: 3px !important;
        }
        .pdf-export-root .waisheng-label .label-divider {
            border-bottom-color: rgba(245, 158, 11, 0.35) !important;
            padding-bottom: 2px !important;
            margin-bottom: 2px !important;
        }

        /* 個人註記：每位成員可顯示不超過 20 字的簡短註記 */
        .person-note-label {
            max-width: 120px;
            color: #334155;
            font-size: 11px;
            line-height: 1.25;
            text-align: center;
            overflow-wrap: anywhere;
            white-space: normal;
            display: inline-block;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #94a3b8;
            border-radius: 6px;
            padding: 2px 5px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.10);
        }
        .pdf-export-root .person-note-label {
            font-size: 12px;
            color: #334155;
            background: rgba(255, 255, 255, 0.96) !important;
            border: 1px solid #64748b !important;
            border-radius: 6px !important;
            padding: 2px 5px !important;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.10) !important;
        }



        /* PDF 匯出：關係、手足稱謂、外省背景、收養／出養、個人註記等標示全部移除框線、底色、陰影，只保留文字 */
        .pdf-export-root [id^="label-"],
        .pdf-export-root .node-container > .absolute[class*="-top-7"],
        .pdf-export-root .waisheng-label,
        .pdf-export-root .adoption-label,
        .pdf-export-root .person-note-label {
            background: transparent !important;
            border: 0 !important;
            border-color: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
            border-radius: 0 !important;
        }
        .pdf-export-root [id^="label-"] span,
        .pdf-export-root .waisheng-label .label-badge,
        .pdf-export-root .adoption-label .label-badge,
        .pdf-export-root .waisheng-label .label-divider {
            background: transparent !important;
            border: 0 !important;
            border-color: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin-bottom: 1px !important;
            border-radius: 0 !important;
            color: inherit !important;
        }


        /* PDF 匯出：保留 glow-gold 金色閃爍提示效果。
           只確保 SVG 外溢可見，不移除 glow-gold、不停用 animation/filter。 */
        .pdf-export-root .node-container svg,
        .pdf-export-root svg.glow-gold {
            overflow: visible !important;
        }
        .pdf-export-root .glow-gold {
            animation: goldGlow 2s infinite ease-in-out !important;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-gray-800 relative">

    <nav id="top-toolbar" class="hide-on-present top-toolbar bg-white shadow-sm border-b border-gray-200 px-6 py-3 flex justify-between items-center z-[60] relative no-scrollbar">
        <div class="flex items-center space-x-4 shrink-0">
            <h1 class="text-xl font-bold text-blue-900 flex items-center">
                <svg class="w-6 h-6 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                家族系統圖
            </h1>
            
            <div class="flex items-center ml-2 pl-4 border-l border-gray-300">
                <label for="client-name" class="text-sm font-bold text-gray-700 mr-2">當事人：</label>
                <input type="text" id="client-name" class="px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none w-32 bg-gray-50 hover:bg-white transition" placeholder="請輸入姓名" onchange="updateGlobal()">
            </div>

            <!-- 復原重做與清空重置 -->
            <div class="flex items-center space-x-2 ml-4">
                <div class="flex space-x-1 border border-gray-200 rounded-lg p-1 bg-gray-50">
                    <button onclick="undo()" class="p-1.5 text-gray-500 hover:text-blue-600 hover:bg-white rounded transition" title="復原 (Ctrl+Z)">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                    </button>
                    <button onclick="redo()" class="p-1.5 text-gray-500 hover:text-blue-600 hover:bg-white rounded transition" title="重做 (Ctrl+Y)">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"></path></svg>
                    </button>
                </div>
                <button onclick="clearAll()" class="flex items-center px-3 py-1.5 text-sm font-medium text-red-600 bg-red-50 border border-red-200 rounded-lg hover:bg-red-100 transition shadow-sm" title="清空所有資料">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    清空重置
                </button>
            </div>
        </div>
        <div class="flex items-center space-x-2 shrink-0">
            <button onclick="showUsageNotice()" class="px-3 py-1.5 text-sm font-extrabold text-amber-700 bg-amber-50 border-2 border-amber-300 rounded-lg hover:bg-amber-100 transition shadow-sm" title="使用聲明" aria-label="使用聲明">！</button>
            <button onclick="showOperationGuide()" class="operation-guide-button px-3 py-1.5 text-sm font-bold text-green-700 bg-green-50 rounded-lg hover:bg-green-100 transition" title="操作說明">操作說明</button>
            <button onclick="zoomIn()" class="p-2 text-gray-600 hover:bg-gray-100 rounded" title="放大"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg></button>
            <button onclick="zoomOut()" class="p-2 text-gray-600 hover:bg-gray-100 rounded" title="縮小"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path></svg></button>
            <div class="w-px h-6 bg-gray-300 mx-1"></div>
            <button onclick="exportPDF()" class="px-3 py-1.5 text-sm font-medium text-red-700 bg-red-50 border border-red-200 rounded hover:bg-red-100">匯出 PDF</button>
            <button onclick="exportJSON()" class="px-3 py-1.5 text-sm font-medium text-green-700 bg-green-50 border border-green-200 rounded hover:bg-green-100">下載 JSON</button>
            <label class="px-3 py-1.5 text-sm font-medium text-purple-700 bg-purple-50 border border-purple-200 rounded hover:bg-purple-100 cursor-pointer">
                匯入 JSON
                <input type="file" id="import-json" class="hidden" accept=".json" onchange="importJSON(event)">
            </label>
        </div>
        <div class="top-toolbar-scroll-hint" aria-hidden="true"></div>
    </nav>

    <div class="flex flex-1 overflow-hidden relative">
        <aside id="left-sidebar" class="hide-on-present bg-white border-r border-gray-200 z-40 shrink-0 transition-all duration-300 ease-in-out relative flex flex-col" style="width: 16rem;">
            <div class="overflow-hidden h-full w-full relative">
                <div id="left-sidebar-content" class="p-4 flex flex-col space-y-4 h-full overflow-y-auto w-64 transition-opacity duration-300 opacity-100">
                    <div class="shrink-0">
                        <h3 class="text-sm font-bold text-gray-800 flex items-center mb-1">
                            <svg class="w-4 h-4 mr-1 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> 系統重大事件 / 糾葛
                        </h3>
                        <textarea id="global-events" class="w-full h-24 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="例如：謀殺、破產、非正常死亡、加害者與受害者的業力連結..." onchange="updateGlobal()"></textarea>
                    </div>
                    <div class="shrink-0">
                        <h3 class="text-sm font-bold text-gray-800 flex items-center mb-1">
                            <svg class="w-4 h-4 mr-1 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg> 被排除/遺忘的成員
                        </h3>
                        <textarea id="global-hidden" class="w-full h-24 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="強調：早夭、流產、墮胎、送養、被家族驅逐的「黑羊」..." onchange="updateGlobal()"></textarea>
                    </div>
                    <div class="shrink-0">
                        <h3 class="text-sm font-bold text-gray-800 flex items-center mb-1">
                            <svg class="w-4 h-4 mr-1 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> 其他圖中沒有的註記
                        </h3>
                        <textarea id="global-notes" class="w-full h-24 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="輸入其他補充資訊..." onchange="updateGlobal()"></textarea>
                    </div>
                    <div class="shrink-0">
                        <h3 class="text-sm font-bold text-gray-800 flex items-center mb-1">
                            <svg class="w-4 h-4 mr-1 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> 期待收穫
                        </h3>
                        <p class="text-[11px] text-gray-500 mb-1.5 leading-tight">如果排列對你有些幫助，你想得到什麼收穫？</p>
                        <textarea id="global-expectation" class="w-full h-24 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="如果排列對你有些幫助，你想得到什麼收穫？" onchange="updateGlobal()"></textarea>
                    </div>
                    <div class="shrink-0 pb-6">
                        <h3 class="text-sm font-bold text-gray-800 flex items-center mb-1">
                            <svg class="w-4 h-4 mr-1 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> 排列師整合釐清
                        </h3>
                        <p class="text-[11px] text-gray-500 mb-1.5 leading-tight">(此欄位為排列師填寫)</p>
                        <textarea id="global-facilitator-notes" class="w-full h-24 p-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="此欄位為排列師填寫" onchange="updateGlobal()"></textarea>
                    </div>
                </div>
            </div>
            
            <button onclick="toggleLeftSidebar()" class="left-sidebar-toggle-handle absolute top-1/2 -translate-y-1/2 z-50 flex items-center justify-center transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-blue-200" title="收合/展開左側欄" aria-label="收合或展開左側欄">
                <span class="toggle-grip" aria-hidden="true"><span></span><span></span><span></span></span>

    <script>
        // --- DATA & HISTORY STATE ---
        const getNewId = () => 'id_' + Math.random().toString(36).substr(2, 9);

        const defaultState = {
            paternal: {
                husband: { id: 'pg_h', type: 'male', status: 'alive', age: '', isGP: true, isWaishengren: false, waishengrenReason: '', isConfirmed: false, adoptionStatus: 'none', otherSystemNotes: '', personNote: '' },
                wife: { id: 'pg_w', type: 'female', status: 'alive', age: '', isGP: true, isWaishengren: false, waishengrenReason: '', isConfirmed: false, adoptionStatus: 'none', otherSystemNotes: '', personNote: '' },
                marriage: { status: '存續', divorceAge: '', relation: '祖父母', isConfirmed: false },
                children: [{ id: 'father', type: 'male', status: 'alive', age: '', isMain: true, role: 'father', relationOption: 'main', isConfirmed: false, adoptionStatus: 'none', otherSystemNotes: '', personNote: '', isWaishengren: false, waishengrenReason: '' }]
            },
            maternal: {
                husband: { id: 'mg_h', type: 'male', status: 'alive', age: '', isGP: true, isWaishengren: false, waishengrenReason: '', isConfirmed: false, adoptionStatus: 'none', otherSystemNotes: '', personNote: '' },
                wife: { id: 'mg_w', type: 'female', status: 'alive', age: '', isGP: true, isWaishengren: false, waishengrenReason: '', isConfirmed: false, adoptionStatus: 'none', otherSystemNotes: '', personNote: '' },
                marriage: { status: '存續', divorceAge: '', relation: '外祖父母', isConfirmed: false },
                children: [{ id: 'mother', type: 'female', status: 'alive', age: '', isMain: true, role: 'mother', relationOption: 'main', isConfirmed: false, adoptionStatus: 'none', otherSystemNotes: '', personNote: '', isWaishengren: false, waishengrenReason: '' }]
            },
            client: {
                marriage: { status: '存續', divorceAge: '', relation: '父母', isConfirmed: false },
                children: [{ id: 'client_node', type: 'star', status: 'alive', age: '', isMain: true, role: 'client', relationOption: 'main', isConfirmed: false, adoptionStatus: 'none', otherSystemNotes: '', personNote: '' }]
            },
            clientFamilies: [], 
            fatherFamilies: [], 
            motherFamilies: [], 
            global: { majorEvents: '', hiddenPeople: '', otherNotes: '', expectation: '', facilitatorNotes: '', clientName: '' } 
        };

        let state = JSON.parse(JSON.stringify(defaultState));
        
        const savedDraft = localStorage.getItem('genogram_draft');
        if (savedDraft) {
            try {
                const parsedData = JSON.parse(savedDraft);
                if(!parsedData.global) parsedData.global = { majorEvents: '', hiddenPeople: '', otherNotes: '', expectation: '', facilitatorNotes: '', clientName: '' };
                if(parsedData.global.clientName === undefined) parsedData.global.clientName = '';
                if(parsedData.global.otherNotes === undefined) parsedData.global.otherNotes = '';
                if(parsedData.global.expectation === undefined) parsedData.global.expectation = '';
                if(parsedData.global.facilitatorNotes === undefined) parsedData.global.facilitatorNotes = '';
                
                if (parsedData.clientFamily && !parsedData.clientFamilies) {
                    parsedData.clientFamilies = [];
                    if (parsedData.clientFamily.spouse) {
                        parsedData.clientFamily.id = 'cf_' + getNewId();
                        parsedData.clientFamilies.push(parsedData.clientFamily);
                    }
                    delete parsedData.clientFamily;
                } else if (parsedData.clientRelationships && !parsedData.clientFamilies) {
                    parsedData.clientFamilies = [];
                    if (parsedData.clientRelationships.length > 0) {
                        let cf = { id: 'cf_' + getNewId(), spouse: parsedData.clientRelationships[0].partner, marriage: { status: '存續', divorceAge: '', relation: '當事人關係' }, children: parsedData.clientRelationships[0].children || [] };
                        if (cf.spouse) cf.spouse.role = 'spouse';
                        cf.marriage.status = (parsedData.clientRelationships[0].statusLabel && parsedData.clientRelationships[0].statusLabel.includes('離')) ? '無' : '存續';
                        parsedData.clientFamilies.push(cf);
                    }
                    delete parsedData.clientRelationships;
                }

                if(!parsedData.clientFamilies) parsedData.clientFamilies = [];
                if(!parsedData.fatherFamilies) parsedData.fatherFamilies = [];
                if(!parsedData.motherFamilies) parsedData.motherFamilies = [];

                // 舊版草稿相容：爸爸、媽媽原本沒有外省背景欄位，補上欄位避免編輯時資料未定義。
                if (parsedData.paternal?.children) {
                    const fatherNode = parsedData.paternal.children.find(c => c.role === 'father' || c.id === 'father');
                    if (fatherNode) {
                        if (fatherNode.isWaishengren === undefined) fatherNode.isWaishengren = false;
                        if (fatherNode.waishengrenReason === undefined) fatherNode.waishengrenReason = '';
                    }
                }
                if (parsedData.maternal?.children) {
                    const motherNode = parsedData.maternal.children.find(c => c.role === 'mother' || c.id === 'mother');
                    if (motherNode) {
                        if (motherNode.isWaishengren === undefined) motherNode.isWaishengren = false;
                        if (motherNode.waishengrenReason === undefined) motherNode.waishengrenReason = '';
                    }
                }

                // 舊版草稿相容：為所有既有成員補上個人註記欄位。
                const ensurePersonNoteFields = (node) => {
                    if (!node) return;
                    if (node.personNote === undefined) node.personNote = '';
                    node.personNote = String(node.personNote || '').slice(0, 20);
                };
                const normalizeNodeStatus = (node) => {
                    if (!node) return;
                    if (!['alive', 'dead', 'unknown'].includes(node.status)) node.status = 'alive';
                };
                ensurePersonNoteFields(parsedData.paternal?.husband); normalizeNodeStatus(parsedData.paternal?.husband);
                ensurePersonNoteFields(parsedData.paternal?.wife); normalizeNodeStatus(parsedData.paternal?.wife);
                ensurePersonNoteFields(parsedData.maternal?.husband); normalizeNodeStatus(parsedData.maternal?.husband);
                ensurePersonNoteFields(parsedData.maternal?.wife); normalizeNodeStatus(parsedData.maternal?.wife);
                parsedData.paternal?.children?.forEach(node => { ensurePersonNoteFields(node); normalizeNodeStatus(node); });
                parsedData.maternal?.children?.forEach(node => { ensurePersonNoteFields(node); normalizeNodeStatus(node); });
                parsedData.client?.children?.forEach(node => { ensurePersonNoteFields(node); normalizeNodeStatus(node); });
                parsedData.clientFamilies?.forEach(f => { ensurePersonNoteFields(f.spouse); normalizeNodeStatus(f.spouse); f.children?.forEach(node => { ensurePersonNoteFields(node); normalizeNodeStatus(node); }); });
                parsedData.fatherFamilies?.forEach(f => { ensurePersonNoteFields(f.spouse); normalizeNodeStatus(f.spouse); f.children?.forEach(node => { ensurePersonNoteFields(node); normalizeNodeStatus(node); }); });
                parsedData.motherFamilies?.forEach(f => { ensurePersonNoteFields(f.spouse); normalizeNodeStatus(f.spouse); f.children?.forEach(node => { ensurePersonNoteFields(node); normalizeNodeStatus(node); }); });

                state = parsedData;
            } catch (e) {
                console.error("讀取草稿失敗，使用預設值", e);
            }
        }

        let historyStack = [];
        let historyIndex = -1;

        function pushHistory() {
            historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(JSON.stringify(state));
            historyIndex++;
            localStorage.setItem('genogram_draft', JSON.stringify(state));
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                state = JSON.parse(historyStack[historyIndex]);
                localStorage.setItem('genogram_draft', JSON.stringify(state)); 
                renderDOM();
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                state = JSON.parse(historyStack[historyIndex]);
                localStorage.setItem('genogram_draft', JSON.stringify(state)); 
                renderDOM();
            }
        }

        pushHistory();

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') { e.preventDefault(); undo(); }
                if (e.key === 'y') { e.preventDefault(); redo(); }
            }
        });

        function getDynamicFileName() {
            const clientName = state.global.clientName.trim() || '未命名';
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const dateString = `${yyyy}${mm}${dd}`;
            return `家族系統圖_${clientName}_${dateString}`;
        }

        const customModal = document.getElementById('custom-modal');
        const customModalContent = document.getElementById('custom-modal-content');
        const customModalTitle = document.getElementById('custom-modal-title');
        const customModalMessage = document.getElementById('custom-modal-message');
        const customModalCancel = document.getElementById('custom-modal-cancel');
        const customModalConfirm = document.getElementById('custom-modal-confirm');

        function showModal({ title = '提示', message, type = 'alert', confirmText = '確定', confirmColor = 'blue', onConfirm }) {
            customModalTitle.innerText = title;
            customModalMessage.innerHTML = message; 
            
            customModalConfirm.disabled = false;
            customModalConfirm.className = `px-4 py-2 text-sm font-medium text-white rounded-lg transition ` + 
                (confirmColor === 'red' ? 'bg-red-600 hover:bg-red-700 shadow-sm shadow-red-200' : 'bg-blue-600 hover:bg-blue-700 shadow-sm shadow-blue-200');
            customModalConfirm.innerText = confirmText;

            customModalConfirm.onclick = () => {

            const delta = -e.deltaY * zoomSensitivity;
            let newScale = Math.min(Math.max(0.4, scale + delta), 2.5);
            
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const unscaledX = (mouseX - panX) / scale;
            const unscaledY = (mouseY - panY) / scale;

            scale = newScale;
            panX = Math.min(Math.max(mouseX - unscaledX * scale, -2600), 800);
            panY = Math.min(Math.max(mouseY - unscaledY * scale, -1800), 500);

            if (!node) return false;
            if (node.type === 'abortion' || node.type === 'miscarriage') {

            } else {

        function renderShape(node, incomplete) {
            // PDF 修正重點：所有圖形都必須完整落在 SVG viewBox 內。
            // 原本把方形/圓形/三角形放大到 viewBox 外（負座標或超過 50），
            // html2canvas 匯出 PDF 時容易把外溢部分裁切，造成圓形、方形、三角形變形。
            const size = 64;
            const c = 32;
            const strokeColor = "#1e3a8a";
            const glowClass = incomplete ? "glow-gold" : "";
            
            let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="relative z-0 ${glowClass}" style="overflow: visible;">`;
            
            if (node.type === 'male') {
                svg += `<rect x="6" y="6" width="52" height="52" fill="white" stroke="${strokeColor}" stroke-width="2.8" rx="3.5"/>`;
            } else if (node.type === 'female') {
                svg += `<circle cx="${c}" cy="${c}" r="26" fill="white" stroke="${strokeColor}" stroke-width="2.8"/>`;
            } else if (node.type === 'abortion') {
                svg += `<polygon points="32,7 7,57 57,57" fill="white" stroke="${strokeColor}" stroke-width="2.8" stroke-linejoin="round"/>`;
            } else if (node.type === 'star') {
                svg += `<polygon points="32,7 39,24 57,24 42.5,35 48,56 32,43 16,56 21.5,35 7,24 25,24" fill="white" stroke="${strokeColor}" stroke-width="2.8" stroke-linejoin="round"/>`;
            }

            if (node.status === 'dead' || node.type === 'abortion') {
                svg += `
                    <line x1="8" y1="8" x2="56" y2="56" stroke="#b91c1c" stroke-width="2.8" stroke-linecap="round"/>
                    <line x1="56" y1="8" x2="8" y2="56" stroke="#b91c1c" stroke-width="2.8" stroke-linecap="round"/>
                `;
            }

            if (node.status === 'unknown') svg += `<text x="${c}" y="41" text-anchor="middle" fill="#475569" font-size="28" font-weight="bold">?</text>`;
            else if (node.role === 'father') svg += `<text x="${c}" y="38" text-anchor="middle" fill="${strokeColor}" font-size="18" font-weight="bold">父</text>`;
            else if (node.role === 'mother') svg += `<text x="${c}" y="38" text-anchor="middle" fill="${strokeColor}" font-size="18" font-weight="bold">母</text>`;
            else if (node.role === 'client') svg += `<text x="${c}" y="38" text-anchor="middle" fill="${strokeColor}" font-size="18" font-weight="bold">我</text>`;
            else if (node.role === 'spouse') svg += `<text x="${c}" y="38" text-anchor="middle" fill="${strokeColor}" font-size="18" font-weight="bold">配</text>`;

            svg += `</svg>`;
            return svg;
        }

        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderNodeHTML(node, group, familyId = null, customClass = '') {
            let infoText = "";
            let textClass = "text-gray-700";
            const incomplete = isNodeIncomplete(node);

            if (node.type === 'abortion' || node.status === 'dead') {

                if (node.age) infoText += `(${escapeHTML(node.age)}歲)`;
                if (node.deathReason) infoText += `<div class="text-xs text-red-700 font-medium mt-1 leading-tight break-words w-full whitespace-pre-wrap">${escapeHTML(node.deathReason)}</div>`;
            } else if (node.status === 'unknown') {
                textClass = "text-gray-600 font-bold";
                infoText = `未知`;
            } else {
                infoText = node.age ? `${escapeHTML(node.age)}歲` : ``;
            }

            const personNote = String(node.personNote || '').slice(0, 20);
            const personNoteHtml = personNote
                ? `<div class="person-note-label mt-1">${escapeHTML(personNote)}</div>`
                : '';

            let gpText = "";
            if (node.isWaishengren) {
                let reasonHtml = node.waishengrenReason ? `<div class="text-gray-700 mt-1 font-normal leading-snug whitespace-pre-wrap">${node.waishengrenReason}</div>` : "";
                let positionClass = node.type === 'male' ? "right-full mr-2.5" : "left-full ml-2.5";
                
                gpText = `<div class="waisheng-label absolute ${positionClass} top-0 bg-amber-50 text-amber-900 px-2.5 py-1.5 rounded-md shadow border border-amber-300 text-left z-20 w-max max-w-[140px] break-words text-[11px] pointer-events-none">

                            ${reasonHtml}
                          </div>`;
            }

            let adoptionLabel = "";
            if (node.adoptionStatus === 'adopted_in') {
                let noteHtml = node.otherSystemNotes ? `<div class="text-[9px] font-normal mt-0.5 leading-tight text-emerald-800">${node.otherSystemNotes}</div>` : "";
                adoptionLabel = `<div class="adoption-label absolute -top-10 -right-6 bg-emerald-50 text-emerald-900 px-1.5 py-1 rounded shadow-sm border border-emerald-300 text-left z-30 w-max max-w-[120px] break-words pointer-events-none">

                let noteHtml = node.otherSystemNotes ? `<div class="text-[9px] font-normal mt-0.5 leading-tight text-purple-800">${node.otherSystemNotes}</div>` : "";

                                    <span class="label-badge bg-purple-600 text-white text-[10px] font-bold px-1 py-0.5 rounded-sm mr-0.5">出養</span>
                                    ${noteHtml}

                'son': '兒子', 'daughter': '女兒'

            if (node.relationOption && roleMap[node.relationOption]) {

        function redrawSVGLinesInDrawArea(drawArea) {
            const svg = drawArea ? drawArea.querySelector('#svg-lines') : null;
            if (!svg || !drawArea) return;

            const cssEscape = (value) => {
                if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(value);
                return String(value).replace(/([ #;?%&,.+*~':"!^$[\]()=>|/@])/g, '\\$1');
            };

            let paths = '';

            // 讓 SVG 畫布比 draw-area 更寬，避免右側成員較多時，最右側線段被 SVG 自身寬度裁切。
            svg.setAttribute('viewBox', '0 0 3200 2600');
            svg.setAttribute('preserveAspectRatio', 'none');
            svg.style.width = '3200px';
            svg.style.height = '2600px';
            svg.style.overflow = 'visible';

            const getLocalCenter = (elId) => {
                const el = drawArea.querySelector('#' + cssEscape(elId));
                if (!el) return null;

                const elRect = el.getBoundingClientRect();
                const areaRect = drawArea.getBoundingClientRect();

                return {
                    x: elRect.left - areaRect.left + (elRect.width / 2),
                    y: elRect.top - areaRect.top + 32,
                    top: elRect.top - areaRect.top + 6
                };
            };

            const drawFamilyLines = (n1Id, n2Id, childrenList, labelId, mStatus, dropExtraLength = 0) => {
                const n1 = getLocalCenter('node-' + n1Id);
                const n2 = getLocalCenter('node-' + n2Id);
                if (!n1 || !n2) return;

                const strokeProps = mStatus === '存續'
                    ? `stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" shape-rendering="geometricPrecision"`
                    : `stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round" shape-rendering="geometricPrecision"`;
                const childStrokeProps = `stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" shape-rendering="geometricPrecision"`;
                const flatY = (n1.y + n2.y) / 2;

                paths += `<line x1="${n1.x}" y1="${flatY}" x2="${n2.x}" y2="${flatY}" ${strokeProps} />`;

                const midX = (n1.x + n2.x) / 2;
                const midY = flatY; 

                const labelEl = drawArea.querySelector('#' + cssEscape(labelId));
                if (labelEl) {
                    labelEl.style.left = `${midX}px`;
                    labelEl.style.top = `${midY - 12}px`;
                    labelEl.style.transform = 'translate(-50%, -100%)';
                }

                let targets = (childrenList || []).map(c => {
                    let center = getLocalCenter('node-' + c.id);
                    if (center) center.node = c;
                    return center;
                }).filter(Boolean);

                if (targets.length === 0) return;

                const minChildTop = Math.min(...targets.map(t => t.top));
                const dropY = minChildTop - 35 - dropExtraLength; 

                paths += `<line x1="${midX}" y1="${midY}" x2="${midX}" y2="${dropY}" ${childStrokeProps} />`;

                const firstX = Math.min(...targets.map(t => t.x), midX);
                const lastX = Math.max(...targets.map(t => t.x), midX);

                // 先畫每個孩子的垂直線，再畫橫向手足線，避免在高解析 PDF 中交會處看起來像斷掉。
                targets.forEach(t => {
                    let strokeStyle = childStrokeProps;
                    if (t.node.adoptionStatus === 'adopted_in') {
                        strokeStyle = `stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="5,4" stroke-linecap="round" shape-rendering="geometricPrecision"`;
                    } else if (t.node.adoptionStatus === 'given_away') {
                        strokeStyle = `stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round" shape-rendering="geometricPrecision"`;
                    }

                    paths += `<line x1="${t.x}" y1="${dropY}" x2="${t.x}" y2="${t.top}" ${strokeStyle} />`;

                    if (t.node.adoptionStatus === 'given_away') {
                        const midVertY = (dropY + t.top) / 2;
                        paths += `<line x1="${t.x - 7}" y1="${midVertY}" x2="${t.x + 7}" y2="${midVertY}" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round" shape-rendering="geometricPrecision" />`;
                    }
                });

                paths += `<line x1="${firstX}" y1="${dropY}" x2="${lastX}" y2="${dropY}" ${childStrokeProps} />`;
            };

            drawFamilyLines('pg_h', 'pg_w', state.paternal.children, 'label-pg-marriage', state.paternal.marriage.status);
            drawFamilyLines('mg_h', 'mg_w', state.maternal.children, 'label-mg-marriage', state.maternal.marriage.status);

            const fatherNode = state.paternal.children.find(c => c.role === 'father');
            const motherNode = state.maternal.children.find(c => c.role === 'mother');
            if (fatherNode && motherNode) {
                drawFamilyLines(fatherNode.id, motherNode.id, state.client.children, 'label-parents-marriage', state.client.marriage.status, 20);
            }

            const clientNode = state.client.children.find(c => c.role === 'client');
            if (clientNode && state.clientFamilies.length > 0) {
                let previousNodeId = clientNode.id;
                state.clientFamilies.forEach((fam) => {
                    drawFamilyLines(previousNodeId, fam.spouse.id, fam.children, `label-client-marriage-${fam.id}`, fam.marriage.status, 20);
                    previousNodeId = fam.spouse.id; 
                });
            }

            if (fatherNode && state.fatherFamilies.length > 0) {
                let previousNodeId = fatherNode.id;
                state.fatherFamilies.forEach((fam) => {

            if (motherNode && state.motherFamilies.length > 0) {
                let previousNodeId = motherNode.id;
                state.motherFamilies.forEach((fam) => {

        function drawSVGLines() {
            const svg = document.getElementById('svg-lines');
            const drawArea = document.getElementById('draw-area');
            if (!svg || !drawArea) return;
            let paths = '';

            const getLocalCenter = (elId) => {
                const el = document.getElementById(elId);
                if (!el) return null;

                let x = 0, y = 0, current = el;
                while (current && current !== drawArea && current !== document.body) {
                    x += current.offsetLeft;
                    y += current.offsetTop;
                    current = current.offsetParent;
                }
                return { 
                    x: x + (el.offsetWidth / 2), 
                    y: y + 25, 
                    top: y + 6 
                };
            };

            const drawFamilyLines = (n1Id, n2Id, childrenList, labelId, mStatus, dropExtraLength = 0) => {
                const n1 = getLocalCenter('node-' + n1Id);
                const n2 = getLocalCenter('node-' + n2Id);
                if (!n1 || !n2) return;

                const strokeProps = mStatus === '存續' ? `stroke="#1e3a8a" stroke-width="3"` : `stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"`;
                const flatY = (n1.y + n2.y) / 2;

                paths += `<line x1="${n1.x}" y1="${flatY}" x2="${n2.x}" y2="${flatY}" ${strokeProps} />`;
                
                const midX = (n1.x + n2.x) / 2;
                const midY = flatY; 

                const labelEl = document.getElementById(labelId);
                if (labelEl) {
                    labelEl.style.left = `${midX}px`;
                    labelEl.style.top = `${midY - 12}px`;
                    labelEl.style.transform = 'translate(-50%, -100%)';
                }

                let targets = childrenList.map(c => {
                    let center = getLocalCenter('node-' + c.id);
                    if (center) center.node = c;
                    return center;
                }).filter(Boolean);
                
                if (targets.length === 0) return;

                const minChildTop = Math.min(...targets.map(t => t.top));
                const dropY = minChildTop - 35 - dropExtraLength; 
                
                paths += `<line x1="${midX}" y1="${midY}" x2="${midX}" y2="${dropY}" stroke="#1e3a8a" stroke-width="2.5" />`;

                const firstX = Math.min(...targets.map(t => t.x), midX);
                const lastX = Math.max(...targets.map(t => t.x), midX);
                paths += `<line x1="${firstX}" y1="${dropY}" x2="${lastX}" y2="${dropY}" stroke="#1e3a8a" stroke-width="2.5" />`;

                targets.forEach(t => {
                    let strokeStyle = `stroke="#1e3a8a" stroke-width="2.5"`;
                    if (t.node.adoptionStatus === 'adopted_in') {
                        strokeStyle = `stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="5,4"`;
                    } else if (t.node.adoptionStatus === 'given_away') {
                        strokeStyle = `stroke="#9ca3af" stroke-width="2.5"`;
                    }
                    
                    paths += `<line x1="${t.x}" y1="${dropY}" x2="${t.x}" y2="${t.top}" ${strokeStyle} />`;

                    if (t.node.adoptionStatus === 'given_away') {
                        const midVertY = (dropY + t.top) / 2;
                        paths += `<line x1="${t.x - 7}" y1="${midVertY}" x2="${t.x + 7}" y2="${midVertY}" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round" />`;
                    }
                });
            };

            drawFamilyLines('pg_h', 'pg_w', state.paternal.children, 'label-pg-marriage', state.paternal.marriage.status);
            drawFamilyLines('mg_h', 'mg_w', state.maternal.children, 'label-mg-marriage', state.maternal.marriage.status);

            const fatherNode = state.paternal.children.find(c => c.role === 'father');
            const motherNode = state.maternal.children.find(c => c.role === 'mother');
            if (fatherNode && motherNode) {
                drawFamilyLines(fatherNode.id, motherNode.id, state.client.children, 'label-parents-marriage', state.client.marriage.status, 20);
            }

            const clientNode = state.client.children.find(c => c.role === 'client');
            if (clientNode && state.clientFamilies.length > 0) {
                let previousNodeId = clientNode.id;
                state.clientFamilies.forEach((fam) => {
                    drawFamilyLines(previousNodeId, fam.spouse.id, fam.children, `label-client-marriage-${fam.id}`, fam.marriage.status, 20);
                    previousNodeId = fam.spouse.id; 
                });
            }

            if (fatherNode && state.fatherFamilies.length > 0) {
                let previousNodeId = fatherNode.id;
                state.fatherFamilies.forEach((fam) => {
                    drawFamilyLines(previousNodeId, fam.spouse.id, fam.children, `label-father-marriage-${fam.id}`, fam.marriage.status, 20);
                    previousNodeId = fam.spouse.id; 
                });
            }

            if (motherNode && state.motherFamilies.length > 0) {
                let previousNodeId = motherNode.id;
                state.motherFamilies.forEach((fam) => {
                    drawFamilyLines(previousNodeId, fam.spouse.id, fam.children, `label-mother-marriage-${fam.id}`, fam.marriage.status, 20);
                    previousNodeId = fam.spouse.id; 
                });
            }

            svg.innerHTML = paths;
        }

        function getNodeRef(group, id) {
            if (group === 'clientFamilies') {
                for (let fam of state.clientFamilies) {
                    if (fam.spouse?.id === id) return fam.spouse;
                    let child = fam.children.find(c => c.id === id);
                    if (child) return child;
                }
                return null;
            }
            if (group === 'fatherFamilies') {
                for (let fam of state.fatherFamilies) {
                    if (fam.spouse?.id === id) return fam.spouse;
                    let child = fam.children.find(c => c.id === id);
                    if (child) return child;
                }
                return null;
            }
            if (group === 'motherFamilies') {
                for (let fam of state.motherFamilies) {
                    if (fam.spouse?.id === id) return fam.spouse;
                    let child = fam.children.find(c => c.id === id);
                    if (child) return child;
                }
                return null;
            }
            if (state[group].husband?.id === id) return state[group].husband;
            if (state[group].wife?.id === id) return state[group].wife;
            return state[group].children.find(c => c.id === id);
        }
